<style>
/* Layout: halaman penuh, tanpa bingkai. Header putih, hijau dan emas. Staf = a scroll of week panels; Pentadbir = review scroll + a teacher x week matrix. */
:root{
  /* Putih, hijau, emas. --navy = hijau jenama (nama pemboleh ubah dikekalkan), --blue = emas */
  --navy:#0F5C36; --blue:#B8862F; --gold-soft:#F7EEDB; --green-soft:#EAF3EC;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F8F5; --line:#DCE6DF; --line-strong:#B6C9BC;
  --fg:#14291D; --muted:#4F645A; --link:#0F5C36;
  --ok:#1D7A4B; --ok-bg:#E1F2E9;
  --sent:#1B63A8; --sent-bg:#E2EFFB;
  --fix:#9A5200; --fix-bg:#FCEBD4;
  --late:#B3261E; --late-bg:#FBE3E1;
  --idle:#56685E; --idle-bg:#EAF0EC;
  --head-bg:#FFFFFF; --head-fg:#0F5C36; --head-muted:#4F645A;
  --focus:#B8862F;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{margin:0;min-height:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:max(.86em,14px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header: putih, tajuk hijau, garis emas */
.top{background:var(--head-bg);color:var(--head-fg);border-bottom:3px solid var(--blue);position:sticky;top:0;z-index:20}
.top-in{max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-family:var(--font-head);font-size:1.4rem;font-weight:700;letter-spacing:.01em;line-height:1.1;color:var(--navy)}
.brand span{font-family:var(--font-mono);font-size:.875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--head-muted)}
.bk{border:1px solid var(--line-strong);background:#fff;color:var(--navy);border-radius:99px;padding:6px 14px;font-weight:600;font-size:.875rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bk:hover{border-color:var(--navy);background:var(--green-soft)}
.top-l{display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap}
.top-l .lg2{margin-right:-4px}
.seg{display:flex;background:var(--green-soft);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:99px;font-weight:600;font-size:.875rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.tabs{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;background:transparent;color:var(--head-muted);padding:10px 14px;font-weight:600;font-size:.9rem;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap}
.tabs button:hover{color:var(--navy)}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--blue)}



.parts{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.file.part .ext{min-width:28px;text-align:center}
.pbtn{display:flex;gap:4px;flex-wrap:wrap}
.pbtn .btn[disabled]{opacity:.4;cursor:not-allowed}
.merge{display:flex;align-items:center;gap:12px;border:1px solid var(--ok);background:var(--ok-bg);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.merge.busy{border-color:var(--line-strong);background:var(--surface-2);color:var(--muted)}
.merge .nm{flex:1;min-width:0}.merge .nm b{display:block;overflow-wrap:anywhere}.merge .nm span{font-size:.875rem;color:var(--muted)}
.pdfv{width:100%;height:520px;border:1px solid var(--line);border-radius:8px;background:#fff}


/* viewer */
.vw{position:fixed;inset:0;z-index:50;background:rgba(6,14,40,.62);display:flex;align-items:stretch;justify-content:center;padding:0}
.vw-in{background:var(--surface);width:100%;max-width:1600px;display:flex;flex-direction:column;min-height:0}
@media(min-width:760px){.vw{padding:10px}.vw-in{border-radius:10px;overflow:hidden}}
.vw-h{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vw-h .t{flex:1;min-width:180px}.vw-h .t b{display:block;font-family:var(--font-head);font-size:1.05rem}.vw-h .t span{font-size:.875rem;color:var(--muted)}
.vw-b{flex:1;min-height:0;overflow:auto;background:var(--surface-2)}
.vw-b iframe{width:100%;height:100%;min-height:70vh;border:0;background:#fff;display:block}
.vw-f{border-top:1px solid var(--line);padding:8px 16px;font-size:.875rem;max-height:18vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.vw-f b{font-size:.875rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.vw-f p{margin:2px 0 0}
.vw-note{font-size:.875rem;color:var(--muted);padding:8px 16px;background:var(--idle-bg)}
.paper{background:#fff;color:#111;margin:16px auto;max-width:820px;padding:24px;box-shadow:0 1px 6px rgba(0,0,0,.18);font-size:.875rem}
.paper h3{margin:0 0 2px;font-family:var(--font-head);font-size:1.1rem;text-align:center}
.paper .sub{text-align:center;color:#444;margin-bottom:12px}
.paper table{width:100%;border-collapse:collapse;margin-top:8px}
.paper th,.paper td{border:1px solid #777;padding:6px 8px;text-align:left;vertical-align:top}
.paper th{background:#E8EBF2;width:1%;white-space:nowrap}
.paper .meta td{border:0;padding:2px 0}
.rk{display:flex;flex-direction:column;gap:10px}
.rk-i{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.rk-i .wk-n{align-self:start}
.rk-i p{margin:4px 0 0;font-size:.875rem;color:var(--muted)}
@media(max-width:560px){.rk-i{grid-template-columns:auto 1fr}.rk-i .btn{grid-column:1/-1}}

/* ===== Penambahbaikan antara muka: teks lebih besar, tindakan utama jelas, menu telefon boleh buka/tutup ===== */
body{font-size:17px;line-height:1.5}
.hero{background:linear-gradient(135deg,#0F5C3A,#17724A);color:#fff;border-radius:14px;padding:20px 22px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:5px solid #E3B85A}

button.tile{text-align:left;cursor:pointer;font:inherit;width:100%}button.tile:hover{border-color:#17724A}button.tile[aria-pressed="true"]{outline:3px solid #E3B85A;border-color:#17724A}

.rday{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:#fff}.rl-f{min-width:0;flex:1}.rl-f textarea,.rl-td select,.rl-td input{width:100%;box-sizing:border-box;max-width:100%}
.rl-td{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-weight:600}.rl-td select,.rl-td input{font:inherit;padding:10px;border:1px solid var(--line,#cfd8cf);border-radius:8px;background:#fff}
.rday>summary{cursor:pointer;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:flex-start;list-style:none;font-size:1.05rem}.rday>summary .pill{margin-left:auto}
.rday>summary::-webkit-details-marker{display:none}.rday>summary::before{content:'▸';margin-right:8px;color:#17724A}.rday[open]>summary::before{content:'▾'}
.rday .rl-row{padding:0 12px 10px}
.mnu{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:700;font-size:1rem;color:#0F5C3A;cursor:pointer;min-height:44px}
.scrim{display:none}
@media(max-width:760px){

  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}

  .hero{padding:16px}.hero .btn{width:100%}
}

/* dashboard */
.dtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dtile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.dtile b{display:block;font-family:var(--font-head);font-size:1.7rem;line-height:1.1}
.dtile span{font-size:.875rem;color:var(--muted)}
.dtile.bad b{color:var(--late)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.gcard.bad{border-left:4px solid var(--late)}.gcard.me{border-color:var(--navy);background:var(--green-soft)}
.gc-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.gc-h .nm b{display:block;font-size:.95rem}.gc-h .nm span{font-size:.875rem;color:var(--muted)}
.gc-s{display:flex;flex-direction:column;gap:4px}.gc-s>span{font-size:.875rem;color:var(--muted);font-weight:600}
.gc-n{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.gc-n b{display:block;font-family:var(--font-head);font-size:1.15rem;line-height:1.1}.gc-n span{font-size:.875rem;color:var(--muted)}
.dlist{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.drow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) 200px;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow .nm b{display:block;font-weight:600}
.drow .nm span{font-size:.875rem;color:var(--muted)}
.dseg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.dseg i{display:block;height:10px;border-radius:2px;background:var(--idle-bg);border:1px solid var(--line)}
.dseg i.ok{background:var(--ok);border-color:var(--ok)}
.dseg i.sent{background:var(--sent);border-color:var(--sent)}
.dseg i.fix{background:var(--fix);border-color:var(--fix)}
.dseg i.late{background:var(--late);border-color:var(--late)}
.dseg i.cuti{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px);border-color:var(--line)}
.dseg i.fut{opacity:.45;background:transparent;border-style:dashed}
.dseg.thin{gap:1px}.dseg.thin i{height:8px;border-radius:1px}
.dseg.gc-r{gap:4px}.dseg.gc-r>div{text-align:center;min-width:0}.dseg.gc-r i{height:16px}.dseg.gc-r em{font-style:normal;font-size:.875rem;color:var(--muted)}
.dlab{display:flex;justify-content:space-between;font-size:.875rem;color:var(--muted);margin-top:3px}
.drow .nm .you{display:inline;font-size:.875rem;font-weight:600;background:var(--sent-bg);color:var(--sent);padding:1px 6px;border-radius:9px;margin-left:4px}
.dup{text-align:right}
.dup b{display:block;font-family:var(--font-head);font-size:1.05rem}
.dup span{font-size:.875rem;color:var(--muted)}
.dup.bad b{color:var(--late)}
.dleg{display:flex;flex-wrap:wrap;gap:12px;font-size:.875rem;color:var(--muted)}
.dleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media(max-width:620px){.drow{grid-template-columns:1fr 150px}.drow .dbar{grid-column:1/-1;order:3}}

/* page */
.wrap{max-width:1400px;margin:0 auto;padding:24px 24px 64px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--font-head);font-weight:700;font-size:1.3rem;margin:0;letter-spacing:.005em;color:var(--navy)}
.wrap>div>h2::after{content:"";display:block;width:44px;height:3px;background:var(--blue);margin-top:6px;border-radius:2px}
.lead{margin:0;color:var(--muted);font-size:.9rem;max-width:68ch}
.flow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.875rem;color:var(--muted);margin:0}
.flow i{font-style:normal;color:var(--line-strong)}
.flow b{color:var(--fg);font-weight:600}

.focus{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:6px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.focus .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.focus .t strong{font-family:var(--font-head);font-size:1.05rem}
.focus .t span{color:var(--muted);font-size:.88rem}
.tally{display:flex;flex-wrap:wrap;gap:6px}

/* buttons */
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:5px;font-weight:600;font-size:.88rem;cursor:pointer}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{border-color:var(--fix);color:var(--fix)}
.btn.sm{padding:6px 10px;font-size:.875rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.875rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.sent{background:var(--sent-bg);color:var(--sent)}
.pill.fix{background:var(--fix-bg);color:var(--fix)}
.pill.late{background:var(--late-bg);color:var(--late)}
.pill.idle{background:var(--idle-bg);color:var(--idle)}

/* week panels */
details.week{background:var(--surface);border:1px solid var(--line);border-radius:6px}
details.week>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px}
details.week>summary::-webkit-details-marker{display:none}
.wk-n{font-family:var(--font-mono);font-weight:500;font-size:.875rem;background:var(--navy);color:#fff;border-radius:4px;padding:4px 7px;min-width:36px;text-align:center}
.wk-meta{display:flex;flex-direction:column;min-width:0}
.wk-meta strong{font-family:var(--font-head);font-size:1rem;line-height:1.2}
.wk-meta .mono{color:var(--muted)}
.now{font-size:.875rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--link);border:1px solid var(--link);border-radius:3px;padding:1px 6px}
.sp{flex:1}
.sum-pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 3px 2px;flex:none;transition:transform .15s}
details[open]>summary .chev{transform:rotate(-135deg);margin-bottom:-3px}
.week-body{border-top:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:16px}

/* parts */

.note{border-radius:5px;padding:10px 12px;font-size:.9rem;border:1px solid transparent}

.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}

/* admin review rows */
.rows{display:flex;flex-direction:column}
.rv{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}

.quote{margin:0;border-left:3px solid var(--line-strong);padding:2px 0 2px 12px;font-size:.92rem}

.rv.miss .rv-h strong{font-weight:600}

/* report */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px}
/* Pemilih minggu: satu minggu dipaparkan pada satu masa, bukan senarai panjang */
.wnav{display:flex;flex-direction:column;gap:8px}

.wsqs{display:flex;flex-wrap:wrap;gap:4px}
.wsq{position:relative;min-width:34px;height:32px;border:1px solid var(--line-strong);border-radius:6px;background:var(--idle-bg);color:var(--idle);font:600 .875rem var(--font-mono);cursor:pointer;padding:0 4px}
.wsq.ok{background:var(--ok-bg);color:var(--ok);border-color:#9FD2B4}.wsq.sent{background:var(--sent-bg);color:var(--sent);border-color:#9CC4EA}
.wsq.fix{background:var(--fix-bg);color:var(--fix);border-color:#EDC48B}.wsq.late{background:var(--late-bg);color:var(--late);border-color:#EDA9A3}

.wsq[aria-pressed="true"]{outline:2px solid var(--navy);outline-offset:1px}
.wsq .dot{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:99px;background:var(--sent);color:#fff;font:600 .875rem/16px var(--font-body);text-align:center;padding:0 3px}
.wleg{font-size:.875rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:5px 12px;font-family:var(--font-mono);font-size:.875rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.big{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.big b{font-family:var(--font-head);font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-size:.92rem}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--idle-bg)}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)}.bar .b-sent{background:var(--sent)}.bar .b-fix{background:var(--fix)}.bar .b-late{background:var(--late)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.875rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{font-style:normal;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.sq{width:10px;height:10px;border-radius:2px;display:inline-block}
.miss-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:.92rem}
.miss-list li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:5px 0}
.miss-list li span{color:var(--muted);font-size:.875rem}
.paste{width:100%;min-height:120px;font-family:var(--font-mono);font-size:.875rem}
.mx-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.mx{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
.mx th,.mx td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line);font-size:.875rem}
.mx thead th{font-family:var(--font-mono);font-weight:500;font-size:.875rem;color:var(--muted);background:var(--surface-2)}
.mx thead th button{border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;padding:2px 4px;border-radius:3px}
.mx thead th.sel{background:var(--sent-bg);color:var(--sent)}
.mx td.sel{background:color-mix(in srgb,var(--sent-bg) 55%,transparent)}
.mx .who{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding-left:12px;min-width:170px;border-right:1px solid var(--line)}
.mx thead .who{background:var(--surface-2)}
.mx .who b{display:block;font-weight:600;font-size:.88rem}
.mx .who span{color:var(--muted);font-size:.875rem}
.mx tfoot td{font-weight:600;background:var(--surface-2);border-bottom:0;font-size:.875rem}
.mx tfoot .who{background:var(--surface-2)}
.cell{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:5px;font-size:.875rem;font-weight:700}
.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-sent{background:var(--sent-bg);color:var(--sent)}
.c-fix{background:var(--fix-bg);color:var(--fix)}
.c-late{background:var(--late-bg);color:var(--late)}
.c-now{border:1.5px solid var(--line-strong);color:var(--muted)}
.c-up{color:var(--line-strong)}
.late-tag{color:var(--late);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:6px;font-size:.88rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
.netbar,#netbar{position:fixed;top:0;left:0;right:0;background:#8a1c1c;color:#fff;padding:12px 16px;font-size:1.05rem;line-height:1.4;text-align:center;font-weight:600;z-index:20;display:none}#netbar.show{display:block}
.toast.err{background:#8a1c1c;pointer-events:auto;font-weight:600}.toast-x{margin-left:10px;border:1px solid #fff;background:transparent;color:#fff;border-radius:6px;padding:6px 12px;font:inherit;min-height:36px;cursor:pointer}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.cmp>div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.88rem;max-height:220px;overflow:auto}@media(max-width:600px){.cmp{grid-template-columns:1fr}}
.tg-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.tg-row:first-of-type{border-top:0}
.note.warn{background:#fff7e0;border-left:4px solid #c8960a}.note.good{background:#e7f5ec;border-left:4px solid #1f7a45}
.foot{color:var(--muted);font-size:.875rem;text-align:center;margin:6px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const nkLbl=x=>String(x||'').toLowerCase().replace(/(isnin|selasa|rabu|khamis|jumaat)\s+\d{1,2}\s+[a-z]{3,9}\.?/g,'$1').replace(/[–—]/g,'-').replace(/\s*·\s*/g,'·').replace(/\s+/g,' ').trim();

   refleksi akan muncul di bawah kelas yang salah. Selaraskan semula mengikut label kelas yang disimpan bersama setiap refleksi.
   Tiada teks diubah, hanya dipindah ke kelas yang betul; refleksi yang tiada padanan dikekalkan di hujung (tidak dibuang). */
function alignR(w,s){if(!s||s.status==='belum'||s.status==='disemak'||s.rdirty||s.rbusy||s.rconflict)return;const SL=slotsFor(ME,w),a=parseR(s.refleksi);if(!SL.length||!a.some(x=>x&&x.k))return;
  const lab=SL.map((_,i)=>slotLabel(ME,i,w)),nl=lab.map(nkLbl),nkA=a.map(x=>x&&x.k?nkLbl(x.k):'');
  /* Label berganda (sisa pepijat lama): baris yang labelnya sama dengan baris lain yang sudah berada di tempat betul dianggap tiada label, jadi ia kekal di kelas tempat ia ditaip. */
  const stale={};nkA.forEach((k,q)=>{if(!k||nl[q]===k)return;const p=nl.indexOf(k);if(p>=0&&p!==q&&nkA[p]===k&&q<SL.length&&a[q].k===lab[p]&&a[p]&&a[p].k===lab[p]){nkA[q]='';stale[q]=1;}});

  SL.forEach((_,i)=>{if(nkA[i]&&nkA[i]===nl[i]&&(isi(a[i])||!a.some((x,q)=>q!==i&&nkA[q]===nl[i]&&isi(x)))){out[i]=Object.assign({},a[i],{k:lab[i]});used[i]=1;}});

  SL.forEach((_,i)=>{if(out[i])return;let j=nkA.findIndex((k,q)=>!used[q]&&k&&k===nl[i]&&isi(a[q]));if(j<0)j=nkA.findIndex((k,q)=>!used[q]&&k&&k===nl[i]);if(j>=0){out[i]=Object.assign({},a[j],{k:lab[i]});used[j]=1;}});

/* Lampiran: refleksi, kehadiran & catatan semakan ditambah di halaman akhir PDF semasa disimpan ke laptop */
async function tambahLaman(blob,w,s){
  try{
    if(!blob||(blob.type&&blob.type.indexOf('pdf')<0))return blob;
    const head=new Uint8Array(await blob.slice(0,5).arrayBuffer());
    if(String.fromCharCode.apply(null,head)!=='%PDF-')return blob;
    await loadPdfLib();
    const L=window.PDFLib,doc=await L.PDFDocument.load(await blob.arrayBuffer()),F=await doc.embedFont(L.StandardFonts.Helvetica),B=await doc.embedFont(L.StandardFonts.HelveticaBold);
    const cl=t=>String(t==null?'':t).replace(/\t/g,' ').replace(/[^\n\x20-\x7E\xA0-\xFF–—‘’“”…]/g,'?');
    const PW=595.28,PH=841.89,M=50,W=PW-2*M;let pg=null,y=0;
    const baru=()=>{pg=doc.addPage([PW,PH]);y=PH-M;};
    const baris=(txt,font,sz)=>{const out=[];cl(txt).split('\n').forEach(p=>{let cur='';p.split(' ').forEach(wd=>{const t=cur?cur+' '+wd:wd;if(font.widthOfTextAtSize(t,sz)>W&&cur){out.push(cur);cur=wd;}else cur=t;});out.push(cur);});return out;};
    const tulis=(txt,font,sz,gap)=>{baris(txt,font,sz).forEach(l=>{if(y<M+sz){baru();}pg.drawText(l,{x:M,y:y-sz,size:sz,font});y-=sz*1.35;});y-=gap||0;};
    const wk=weeks[w-1]||{};
    baru();
    tulis('SEKOLAH KEBANGSAAN KRANGAN',B,13,2);
    tulis('Lampiran RPH Minggu '+w+(wk.label?' ('+wk.label+')':''),B,11,2);
    tulis(MYNAME+(s.reviewed?' | Disemak: '+s.reviewed:''),F,10,10);
    const rl=parseR(s.refleksi).filter(x=>x.t.trim()||x.h.trim()||x.x);
    tulis('Refleksi dan kehadiran murid',B,12,4);
    if(!rl.length)tulis('Refleksi tiada.',F,10,6);
    rl.forEach((x,i)=>{const nm=slotK(x,ME,i,w)||('Kelas '+(i+1));
      if(x.x){tulis(nm+' - PdP ditangguh',B,10.5,1);tulis('Sebab: '+x.x+(x.n?' - '+x.n:''),F,10,8);}
      else{tulis(nm+' - Murid hadir: '+(rHadir(x)||'belum diisi'),B,10.5,1);tulis(x.t||'',F,10,8);}});
    if(s.komen){y-=4;tulis('Catatan semakan',B,12,4);tulis(s.komen,F,10,6);}
    return new Blob([await doc.save()],{type:'application/pdf'});
  }catch(e){return blob;}
}

let zipP=null;
function loadZip(){

  if(!zipP)zipP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';sc.onload=res;sc.onerror=()=>{zipP=null;rej(new Error('Pustaka ZIP tidak dapat dimuatkan. Semak sambungan internet.'));};document.head.appendChild(sc);});

}
const safeName=x=>String(x).normalize('NFKD').replace(/[^\w.\- ]+/g,'').trim().replace(/\s+/g,'_').slice(0,60)||'fail';
async function arkibFile(w,f){

}

async function arkibMuat(mode){

          else row.catatan='mod contoh: fail tiada';
        }catch(e){if(e&&e.code==='AUTH')throw e;gagal++;row.catatan='fail tidak dapat dimuat turun, cuba lagi';}

    zip.file('INDEX.html',arkibIndex(rows,MYNAME,tarikh));

    const out=await zip.generateAsync({type:'blob',compression:'STORE'});
    const a=document.createElement('a'),u=URL.createObjectURL(out);a.href=u;a.download='RPH-Disemak_'+safeName(MYNAME.replace(/^Cg\.\s*/,''))+'_'+ymd+'.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);

function cellFor(s,w){
  if(weeks[w-1].cuti)return['c-up','–','Cuti'];

  if(s.status==='dihantar')return[s.diterima?'c-sent':'c-sent',s.diterima?'✓':'●',s.diterima?'Diterima':'Dihantar'];

/* ===== Pembaca jadual waktu aSc (PDF) — berjalan dalam pelayar, tanpa AI, tiada data keluar =====
   Membaca kedudukan teks sebenar dalam PDF (bukan meneka daripada gambar). */
function jwParseItems(items){
  const out={ok:false,slots:[],jumlah:0,jangka:null,amaran:[],sebab:''};
  const T=items.map(i=>({s:String(i.s).trim(),x:i.x,y:i.y,w:i.w})).filter(i=>i.s);
  /* 1. Baris pengepala: nombor 1..N menaik pada satu baris */
  const nums=T.filter(i=>/^\d{1,2}$/.test(i.s));let head=null;
  nums.forEach(a=>{const g=nums.filter(b=>Math.abs(b.y-a.y)<=3).sort((p,q)=>p.x-q.x);
    let ok=g.length>=4&&g.every((b,i)=>+b.s===i+1);if(ok&&(!head||g.length>head.length))head=g;});
  if(!head){out.sebab='Pengepala waktu (1,2,3…) tidak ditemui';return out;}
  const hy=head[0].y;
  const cols=head.map(b=>({n:+b.s,c:b.x+b.w/2}));
  const rh=T.find(i=>/^REHAT$/i.test(i.s)&&Math.abs(i.y-hy)<=12);
  if(rh)cols.push({n:null,c:rh.x+rh.w/2});
  cols.sort((a,b)=>a.c-b.c);
  const sp=(cols[cols.length-1].c-cols[0].c)/(cols.length-1);
  cols.forEach((c,i)=>{c.l=i?(cols[i-1].c+c.c)/2:c.c-sp/2;c.r=i<cols.length-1?(c.c+cols[i+1].c)/2:c.c+sp/2;});
  const L=cols[0].l,R=cols[cols.length-1].r;
  const colOf=x=>cols.find(c=>x>=c.l&&x<c.r)||(x<L?cols[0]:cols[cols.length-1]);
  /* 2. Label hari di sebelah kiri */
  const DM={mo:1,is:1,tu:2,se:2,we:3,ra:3,th:4,kh:4,fr:5,ju:5};
  const days=[];
  T.forEach(i=>{if(i.x+i.w<=L+4&&i.y>hy+15&&/^(mo|tu|we|th|fr|is|se|ra|kh|ju)[a-z]*$/i.test(i.s)&&i.s.length<=8){
    const h=DM[i.s.slice(0,2).toLowerCase()];if(h&&!days.some(d=>d.h===h))days.push({h,y:i.y});}});
  days.sort((a,b)=>a.y-b.y);
  if(days.length<2){out.sebab='Label hari tidak ditemui';return out;}
  const gaps=days.slice(1).map((d,i)=>d.y-days[i].y).sort((a,b)=>a-b);const rs=gaps[Math.floor(gaps.length/2)];
  /* 3. Kandungan sel */
  const body=T.filter(i=>{const cx=i.x+i.w/2;return cx>L&&cx<R&&i.y>hy+15&&!/^\d{1,2}:\d{2}$/.test(i.s);});
  const bad=[];
  days.forEach(d=>{
    const tk=body.filter(i=>i.y>=d.y-0.45*rs&&i.y<=d.y+0.42*rs);if(!tk.length)return;
    const ys=tk.map(i=>i.y),mn=Math.min(...ys),mx=Math.max(...ys),mid=(mn+mx)/2;
    const split=mx-mn>10;
    const sub=tk.filter(i=>!split||i.y<=mid).sort((a,b)=>a.x-b.x),cls=split?tk.filter(i=>i.y>mid).sort((a,b)=>a.x-b.x):[];
    if(cls.length&&cls.length!==sub.length){bad.push(['Isn','Sel','Rab','Kha','Jum'][d.h-1]);return;}
    sub.forEach((s,i)=>{const c=cls[i];
      const lo=Math.min(s.x,c?c.x:s.x),hi=Math.max(s.x+s.w,c?c.x+c.w:s.x+s.w);
      let a=colOf(lo+2),b=colOf(hi-2),ci=cols.indexOf(a),cj=cols.indexOf(b);
      while(ci<=cj&&cols[ci].n==null)ci++;while(cj>=ci&&cols[cj].n==null)cj--;
      if(ci>cj){bad.push('?');return;}
      const p1=cols[ci].n,p2=cols[cj].n,w=p1===p2?'W'+p1:'W'+p1+'–'+p2;
      out.jumlah+=p2-p1+1;
      out.slots.push({h:d.h,k:((c?c.s+' · ':'')+s.s+' · '+w).slice(0,60)});});
  });
  /* 4. Jumlah dijangka: "Lessons/week N" */
  const lw=T.find(i=>/^Lessons\/week$/i.test(i.s));
  if(lw){const v=T.filter(i=>/^\d+$/.test(i.s)&&i.x>lw.x&&Math.abs(i.y-lw.y)<=4).sort((a,b)=>a.x-b.x)[0];if(v)out.jangka=+v.s;}
  if(bad.length){out.sebab='Bilangan subjek/kelas tidak sepadan pada hari '+bad.join(', ');out.slots=[];out.jumlah=0;return out;}
  if(!out.slots.length){out.sebab='Tiada sel kelas ditemui';return out;}
  out.ok=true;
  if(out.jangka!=null&&out.jangka!==out.jumlah)out.amaran.push('Jumlah waktu bacaan ('+out.jumlah+') tidak sama dengan "Lessons/week" dalam fail ('+out.jangka+'). Semak dengan teliti.');
  return out;
}
let pdfJsP=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve();
  if(!pdfJsP)pdfJsP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res();};
    sc.onerror=()=>{pdfJsP=null;rej(new Error('Pustaka PDF tidak dapat dimuatkan.'));};document.head.appendChild(sc);});
  return pdfJsP;
}
async function jwParsePdf(buf){
  await loadPdfJs();

  const pg=await doc.getPage(1),vp=pg.getViewport({scale:1}),tc=await pg.getTextContent();
  return jwParseItems(tc.items.map(i=>({s:i.str,x:i.transform[4],y:vp.height-i.transform[5],w:i.width})));
}

async function arsMuat(){
  const a=ui.ars;if(a.busy)return;a.busy=true;a.err='';render();
  try{
    if(!LIVE){await new Promise(r=>setTimeout(r,250));a.years=['2025'];a.mg={'2025':4};}
    else{const r=await api('arkibSenarai',{});a.years=r.tahun||[];a.mg=r.minggu||{};}
    if(a.years.length&&!a.tahun)a.tahun=a.years[0];
  }catch(e){a.err=e.message||'Senarai arkib tidak dapat dimuatkan.';}
  a.busy=false;render();
}
async function arsPapar(){
  const a=ui.ars;if(a.busy)return;
  const y=document.getElementById('ars-y'),w=document.getElementById('ars-w'),c=document.getElementById('ars-c');
  if(y)a.tahun=y.value;if(w)a.minggu=w.value;if(c)a.cari=c.value;
  a.busy=true;a.err='';render();
  try{
    let r;
    if(!LIVE){await new Promise(x=>setTimeout(x,250));r=DEMO_ARS();const q=a.cari.trim().toLowerCase();r.rows=r.rows.filter(x=>(!a.minggu||x.w===+a.minggu)&&(!q||x.nama.toLowerCase().includes(q)));}
    else r=await api('arkibBaca',{tahun:a.tahun,minggu:a.minggu||undefined,cari:a.cari.trim()||undefined});
    a.rows=r.rows||[];a.takwim=r.takwim||[];a.terpotong=!!r.terpotong;
  }catch(e){a.err=e.message||'Arkib tidak dapat dibaca.';a.rows=null;}
  a.busy=false;render();
}
const ARS_ST={disemak:'Disemak',dihantar:'Dihantar',pembetulan:'Perlu pembetulan',draf:'Draf',belum:'Tidak dihantar'};
function arsRefl(s){
  const rl=parseR(s).filter(x=>x.t.trim()||x.h.trim()||x.x);if(!rl.length)return '<span class="hint">Tiada refleksi.</span>';
  return '<details><summary>'+rl.length+' kelas</summary><ul class="ars-r">'+rl.map(x=>'<li><b>'+esc(x.k||'-')+'</b> · '+(x.x?'<i>PdP ditangguh</i> — '+esc(x.x)+(x.n?': '+esc(x.n):''):(rHadir(x)?'hadir '+esc(rHadir(x))+' · ':'')+esc(x.t))+'</li>').join('')+'</ul></details>';
}
async function arsFail(btn){

  try{const r=await api('arkibFail',{tahun:a.tahun,e:btn.dataset.e,w:+btn.dataset.w,versi:btn.dataset.v||undefined}),bin=atob(r.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    const ext=/word/.test(r.mime||'')?'docx':'pdf',url=URL.createObjectURL(new Blob([u],{type:r.mime||'application/pdf'})),x=document.createElement('a');
    x.href=url;x.download='RPH_'+a.tahun+'_M'+btn.dataset.w+(btn.dataset.v?'_V'+btn.dataset.v:'')+'.'+ext;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}

let EXALL=[],AUDIT=[],AUDITJ=[],AUDITLOAD=false,AUDITERR='',ME_EMEL='',ME_JAWATAN='',ME_PERANAN='guru',ME_ADMIN=!LIVE,ME_ICT=false,ME_MENGAJAR=true;
const NLBL={pembetulan:'Perlu pembetulan',disemak:'Telah disemak',makluman:'Makluman'};
const mapEx=x=>({id:x.id,t:x.t,a:+x.a,b:+x.b,sebab:x.sebab||'',oleh:x.oleh||'',masa:x.masa||'',aktif:x.aktif!==false});
function setEx(r){EXEMPT=(r.pengecualian||[]).map(mapEx);if(r.pengecualianSemua)EXALL=r.pengecualianSemua.map(mapEx);}
function syncEx(){EXEMPT=EXALL.filter(x=>x.aktif);}
const exStatus=x=>!x.aktif?'Dibatalkan':(x.b<CURRENT?'Tamat':'Aktif');
const MYT=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kuching',day:'numeric',month:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
function fmtFull(iso){const d=new Date(iso);if(!iso||isNaN(d))return'';const p=MYT.formatToParts(d).reduce((o,x)=>(o[x.type]=x.value,o),{});return p.day+' '+MON[+p.month-1]+' '+p.year+', '+p.hour+':'+p.minute;}
const wkRange=(a,b)=>(weeks[a-1]?weeks[a-1].label:'')+(b>a&&weeks[b-1]?' – '+weeks[b-1].label:'');

const ST={disemak:['ok','Disemak'],dihantar:['sent','Dihantar'],pembetulan:['fix','Perlu pembetulan'],lewat:['late','Lewat'],belum:['idle','Belum hantar'],dikecualikan:['idle','Dikecualikan']};
function stOf(t,w){const s=sub(t.id,w),ex=(exc(t.id,w)||MLK(w))&&!submitted(s);return ex?'dikecualikan':s.status==='disemak'?'disemak':s.status==='dihantar'?'dihantar':s.status==='pembetulan'?'pembetulan':isLate(s,w,t.id)?'lewat':'belum';}
const stPill=k=>'<span class="pill '+ST[k][0]+'">'+ST[k][1]+'</span>';
function tbl(head,rows,empty){return '<div class="mx-scroll"><table class="tbl"><thead><tr>'+head.map(h=>'<th scope="col">'+h+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+head.length+'" class="hint">'+(empty||'Tiada rekod.')+'</td></tr>')+'</tbody></table></div>';}
function wkSelect(attr){return '<select '+attr+' aria-label="Minggu">'+semuaMg().map(x=>'<option value="'+x.n+'"'+(x.n===ui.selWeek?' selected':'')+'>Minggu '+x.n+' ('+x.label+')</option>').join('')+'</select>';}

/* --- Staf: dashboard --- */
function myStats(){let belum=0,hantar=0,disemak=0,fix=0,kec=0;
  weeks.forEach(wk=>{if(wk.cuti||wk.n>CURRENT)return;const k=stOf({id:ME},wk.n);
    if(k==='disemak')disemak++;else if(k==='dihantar')hantar++;else if(k==='pembetulan')fix++;else if(k==='dikecualikan')kec++;else belum++;});
  return{belum,hantar,disemak,fix,kec};}
function notifItem(n,lihat){
  const cls=n.readAt?'info':n.jenis==='pembetulan'?'fix':n.jenis==='disemak'?'ok':'info';
  return '<div class="note '+cls+'"><b>'+(NLBL[n.jenis]||'Notifikasi')+(n.w?' · Minggu '+n.w:'')+(n.readAt?'':' <span class="pill fix">Baharu</span>')+'</b><p>'+esc(n.mesej)+'</p><small>'+fmtFull(n.createdAt)+'</small>'+
   '<div class="actions">'+(lihat&&n.w&&sub(ME,n.w)?'<button class="btn sm" data-act="nlihat" data-w="'+n.w+'">Lihat</button>':'')+(n.readAt?'':'<button class="btn sm" data-act="nread" data-id="'+esc(n.id)+'">Tandakan dibaca</button>')+'</div></div>';}
const hfKat=(s,n)=>{const k=stOf({id:ME},n);return k==='dikecualikan'?'kec':k==='lewat'?'belum':k;};
/* Peringatan: RPH minggu depan mesti dihantar sebelum Jumaat, kerana guru perlu sudah merancang untuk hari Isnin. */
function nudgeDepan(){
  return '';
  const nx=weeks.find(x=>!x.cuti&&x.n>CURRENT);if(!nx||NOW>deadline(nx.n))return '';
  const s=sub(ME,nx.n);if(submitted(s)||exc(ME,nx.n))return '';
  return '<p class="hint"><b>RPH Minggu '+nx.n+'</b> ('+esc(nx.label)+') mesti dihantar sebelum <b>'+fmtDL(deadline(nx.n))+'</b>. <button class="btn sm" data-act="nlihat" data-w="'+nx.n+'">Muat naik</button></p>';
}
function heroGuru(){
  const cur=sub(ME,CURRENT),wk=weeks[CURRENT-1],need=rNeed(ME,CURRENT),done=rDone(cur,ME,CURRENT);
  let st,btn='',info='';
  if(exc(ME,CURRENT)&&!submitted(cur)){st='Dikecualikan minggu ini';info='Anda dikecualikan daripada menghantar RPH minggu ini.';}
  else if(cur.status==='disemak'){st='Telah disemak';btn=['Lihat semakan','nlihat'];info='RPH anda telah disemak.';}
  else if(cur.status==='pembetulan'){st='Perlu pembetulan';btn=['Betulkan RPH','nlihat'];info='Pentadbir meminta pembetulan. Baca catatan dan hantar semula.';}
  else if(cur.status==='dihantar'){st='Menunggu semakan';info='RPH sudah dihantar.'+(RFX(ME)?'':done<need?' Refleksi: '+done+' / '+need+' RPH.':' Refleksi lengkap.');btn=done<need?['Lengkapkan Refleksi','nlihat']:['Buka RPH','nlihat'];}
  else if(!cur.file){st='Belum dihantar';btn=['Muat Naik RPH','nlihat'];info='Fail RPH belum dimuat naik.';}
  else{st='Fail sudah dimuat naik';btn=['Hantar RPH','nlihat'];info='Tekan Hantar untuk menghantar RPH kepada pentadbir.';}
  return '<div class="hero"><div><span class="hs">'+esc(st)+'</span><h3>RPH Minggu '+CURRENT+'</h3><p>'+esc(wk.label)+' '+wk.s.getFullYear()+' · '+cakup(CURRENT)+'Tarikh akhir hantar: <b>'+fmtDL(deadline(CURRENT))+'</b></p><p>'+esc(info)+'</p>'+nudgeDepan()+'</div>'+
    (btn?'<button class="btn" data-act="'+btn[1]+'" data-w="'+CURRENT+'">'+btn[0]+'</button>':'')+'</div>';
}
/* Senarai tugasan yang masih tertunggak (selain minggu semasa yang sudah dipaparkan pada kad utama), paling lama dahulu. */
function tugasTertunggak(){const o=[];
  const kini=new Date(),hI=new Date(kini.getFullYear(),kini.getMonth(),kini.getDate()).getTime(),BLK={k:'',t:'',h:'',j:'',x:'',n:''};
  weeks.forEach(wk=>{if(wk.cuti||wk.n>CURRENT||wk.n===CURRENT||MLK(wk.n))return;const s=sub(ME,wk.n);if(exc(ME,wk.n)&&!submitted(s))return;
    /* refleksi dikira hanya bagi kelas yang sudah berlangsung (cth. Isnin minggu berikutnya belum tiba) */
    const SLk=slotsFor(ME,wk.n),ak=parseR(s.refleksi),tiba=i=>{const x=SLk[i];if(!x)return true;const d0=hariTrk(x.h,wk.n);return new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()).getTime()<=hI;},
      blm=RFX(ME)?0:SLk.filter((x,i)=>tiba(i)&&!islSlot(ME,wk.n,i)&&!(x.prog&&x.tp&&x.tp!=='p')&&!tdSlot(x,ak[i]||BLK)&&!rFull(ak[i]||BLK)).length,
      d=rDone(s,ME,wk.n),n=rNeed(ME,wk.n);
    if(s.status==='pembetulan')o.push({w:wk.n,t:'Perlu pembetulan',c:'fix'});
    else if(s.status==='belum'||s.status==='draf')o.push({w:wk.n,t:s.file?'Fail sudah dimuat naik, belum dihantar':'RPH belum dimuat naik dan dihantar',c:'late'});
    else if(s.status==='dihantar'&&blm>0)o.push({w:wk.n,t:'Refleksi belum lengkap ('+d+' / '+n+' RPH)',c:'idle'});});
  return o;}
function tugasCard(){const t=tugasTertunggak();if(!t.length)return '';
  return '<div class="card"><span class="lbl">Perlu tindakan <span class="pill fix">'+t.length+'</span></span>'+t.slice(0,6).map(x=>'<div class="tg-row"><span><b>Minggu '+x.w+'</b> · '+esc(x.t)+'</span><button class="btn sm pri" data-act="nlihat" data-w="'+x.w+'">Pergi</button></div>').join('')+(t.length>6?'<p class="hint">Dan '+(t.length-6)+' lagi. Gunakan jubin status di atas untuk menapis.</p>':'')+'</div>';}

  const jenis=[...new Set(rows.map(r=>r.tindakan))].sort();

let DEMO_TK=null,DEMO_MULA=1,DEMO_SEM=[];
function urusApi(action,data){
  if(LIVE)return api(action,data);
  if(!DEMO_TK)DEMO_TK=weeks.map(w=>({mula:isoD(w.s),tamat:isoD(w.e),jenis:w.cuti?'cuti':'sekolah',nama:w.nama||''}));
  const rebuild=()=>buildWeeks(DEMO_TK.map((x,i)=>i+1<DEMO_MULA?Object.assign({},x,{jenis:'cuti',nama:'Sebelum sistem digunakan'}):x));
  if(action==='urusBaca')return Promise.resolve({urus:{takwim:DEMO_TK,mulaMinggu:DEMO_MULA,sementara:DEMO_SEM,staf:{sumber:'sandaran',masa:'',cmsBil:0,bil:teachers.length,terlepas:[]},hantaranBil:0,tahun:DEMO_TK.length?+DEMO_TK[0].mula.slice(0,4):2026}});
  if(action==='urusTandaLama'){let b=0;teachers.forEach(t=>{for(let w=1;w<=data.hingga;w++){if(weeks[w-1].cuti)continue;const q=subs[key(t.id,w)];if(q&&!submitted(q)){q.status='disemak';q.komen='Direkod sebagai sudah dihantar sebelum iRISE digunakan.';b++;}}});return Promise.resolve({baru:b,dikemas:0,langkau:0});}
  if(action==='urusMula'){DEMO_MULA=data.mulaMinggu;rebuild();return Promise.resolve({mulaMinggu:DEMO_MULA});}
  if(action==='urusTakwim'){DEMO_TK=data.takwim;rebuild();return Promise.resolve({});}
  if(action==='urusSementara'){DEMO_SEM=data.senarai;return Promise.resolve({sementara:DEMO_SEM});}
  if(action==='urusSesi'){DEMO_TK=[];DEMO_MULA=1;subs={};buildWeeks([]);return Promise.resolve({ditutup:data.tahun,rekod:0});}
  return Promise.reject(new Error('Tindakan tidak diketahui.'));
}
function isoD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function urusMuat(segar){
  ui.urLoad=true;ui.urErr='';render();
  urusApi('urusBaca',segar?{segarStaf:1}:undefined).then(r=>{ui.ur=r.urus;ui.urLoad=false;ui.urF=ui.urF||{};
    ui.urF.tk=ui.ur.takwim.map(x=>[x.mula,x.tamat,x.jenis,x.nama].join(', ')).join('\n');ui.urF.mula=String(ui.ur.mulaMinggu);ui.urF.tahun='';render();if(segar)toast('Senarai staf disegarkan.');})
   .catch(e=>{ui.urLoad=false;ui.urErr=(e&&e.message)||'Gagal memuatkan.';handleErr(e);render();});
}
function urusParseTk(txt){
  const rows=[],err=[];
  String(txt||'').split(/\r?\n/).forEach((ln,i)=>{
    if(!ln.trim())return;
    const p=ln.split(/\t|,|;/).map(x=>x.trim());
    if(!/^\d{4}-\d{2}-\d{2}$/.test(p[0]||'')){if(rows.length===0&&!err.length)return;err.push('Baris '+(i+1)+': tarikh mula mesti yyyy-mm-dd.');return;}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(p[1]||'')){err.push('Baris '+(i+1)+': tarikh tamat mesti yyyy-mm-dd.');return;}
    const j=(p[2]||'sekolah').toLowerCase();
    if(j!=='sekolah'&&j!=='cuti'){err.push('Baris '+(i+1)+': jenis mesti sekolah atau cuti.');return;}
    rows.push({mula:p[0],tamat:p[1],jenis:j,nama:p.slice(3).join(', ')});
  });
  return {rows,err};
}
function urusDone(msg,reload){
  const f=()=>{ui.urSaving=false;toast(msg);urusMuat();};
  if(LIVE&&reload)loadInit(true).then(f).catch(handleErr);else f();
}
function urusTakwim(){
  const x=urusParseTk(ui.urF.tk);
  if(x.err.length){toast(x.err[0]);return;}
  if(!x.rows.length){toast('Tiada baris takwim.');return;}
  if(!confirm('Simpan takwim baharu ('+x.rows.length+' minggu, '+x.rows[0].mula+' hingga '+x.rows[x.rows.length-1].tamat+')? Nombor minggu akan mengikut susunan baris.'))return;

}

/* --- Laporan: carta, mengikut staf, senarai, statistik --- */
function donut(parts){const tot=parts.reduce((a,p)=>a+p[1],0)||1;let acc=0;const g=parts.map(p=>{const s=acc/tot*100;acc+=p[1];return p[2]+' '+s+'% '+(acc/tot*100)+'%';}).join(',');
  return '<div class="donut" role="img" aria-label="'+parts.map(p=>p[0]+' '+Math.round(p[1]/tot*100)+'%').join(', ')+'" style="background:conic-gradient('+g+')"><span title="Peratus telah dihantar (termasuk menunggu semakan dan pembetulan)">'+Math.round((tot-parts[parts.length-1][1])/tot*100)+'%</span></div>';}
function barChart(parts){const mx=Math.max(1,...parts.map(p=>p[1]));return '<div class="bars" role="img" aria-label="'+parts.map(p=>p[0]+' '+p[1]).join(', ')+'">'+parts.map(p=>'<div class="bcol"><em>'+p[1]+'</em><i style="height:'+Math.round(p[1]/mx*100)+'%;background:'+p[2]+'"></i><span>'+p[0]+'</span></div>').join('')+'</div>';}
function guruRows(){
  return teachers.map(t=>{let w=0,h=0,d=0,fx=0,lw=0,kc=0;active().forEach(x=>{const k=stOf(t,x.n);if(k==='dikecualikan'){kc++;return;}w++;if(k==='disemak'){h++;d++;}else if(k==='dihantar')h++;else if(k==='pembetulan'){fx++;h++;}else if(k==='lewat')lw++;});
    return{t,w,h,d,fx,lw,kc,pct:w?Math.round(h/w*100):100};});
}
function overallStats(){const r=guruRows();let w=0,h=0,d=0,fx=0,lw=0;r.forEach(x=>{w+=x.w;h+=x.h;d+=x.d;fx+=x.fx;lw+=x.lw;});return{w,h,d,fx,lw,pct:w?Math.round(h/w*100):100};}

}

async function api(action,data,_retry){
  const body=JSON.stringify(Object.assign({action,idToken:ID_TOKEN,reqId:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},data||{}));
  let r;
  const had=Math.min(240000,100000+Math.round(body.length/1048576)*12000);/* > masa menunggu giliran di pelayan (90 s) supaya permintaan tidak dibatalkan semasa beratur *//* fail besar di internet perlahan perlukan masa lebih */
  const GET=()=>{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),had);
    return fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:ac.signal}).finally(()=>clearTimeout(tm));};
  try{r=await GET();}
  catch(e){
    // Rangkaian terputus: cuba sekali lagi dengan reqId yang SAMA supaya pelayan tidak mengulang operasi yang mungkin sudah berjaya.
    await new Promise(res=>setTimeout(res,1500));

    catch(e2){const x=new Error(e2&&e2.name==='AbortError'?'Pelayan tidak menjawab dalam '+Math.round(had/1000)+' saat. Fail anda masih selamat. Cuba lagi sebentar.':'Tiada internet buat masa ini. Fail anda masih selamat. Sila cuba lagi apabila internet pulih.');x.apiMsg=true;x.code='NET';throw x;}

  for(let n=0;!j.ok&&j.code==='BUSY'&&n<4;n++){
    if(n===0)toast('Ramai sedang menghantar serentak. iRISE mencuba semula secara automatik, jangan tutup halaman…');
    await new Promise(res=>setTimeout(res,2500*(n+1)+Math.round(Math.random()*1500)));
    try{r=await GET();j=await r.json();}catch(e){break;}
  }
  if(!j.ok){if(j.code==='AUTH'&&EMBED&&!_retry){await askParentToken();return api(action,data,true);}
    const x=new Error(j.code==='STALE'?'Rekod anda baru sahaja dikemas kini. Sila cuba sekali lagi.':(j.error||'Ralat pelayan. Sila cuba lagi.'));x.code=j.code;x.versi=j.versi;x.teks=j.teks;x.semakVersi=j.semakVersi;x.apiMsg=true;throw x;}

}

      return;}
    if(err.code==='AUTH'){posSimpan();handleErr(err);return;}
    q.rErrMsg=String(err.message||'');q.retryN=(q.retryN||0)+1;
    if(err.code==='NET'&&navigator.onLine===false){q.offline=true;const sv0=document.getElementById('sv-'+w);if(sv0)sv0.textContent=OFFMSG;return;}
    {const sv=document.getElementById('sv-'+w);if(sv){sv.textContent='Gagal disimpan: '+String(err.message||'cuba lagi').replace(/\.$/,'')+'. Teks anda masih ada di sini. Cuba semula automatik dalam '+Math.round(bkOff(q.retryN)/1000)+' saat. ';const bt=document.createElement('button');bt.className='btn sm';bt.dataset.act='rretry';bt.dataset.w=w;bt.textContent='Cuba lagi';sv.appendChild(bt);}}
    clearTimeout(q._t);q._t=setTimeout(()=>saveRefl(w),bkOff(q.retryN));
  }
}
/* Sebelum hantar: pastikan refleksi tersimpan. Jika konflik (refleksi juga disimpan dari tab/peranti lain), tanya guru terus. */
async function flushReflSah(w,apa){

    q.refleksiVersi=q.srvVer||0;q.rconflict=false;q.rver=(q.rver||0)+1;q.rdirty=true;ok=await flushRefl(w);if(ok)return true;}
  toast('Refleksi belum berjaya disimpan'+(q.rErrMsg?': '+q.rErrMsg.replace(/\.$/,''):'')+'. '+apa+' belum dihantar. Semak internet dan cuba lagi.',true);return false;}
async function flushRefl(w){
  /* Tunggu sehingga simpanan yang sedang berjalan selesai (pelayan Apps Script boleh mengambil 5–20 saat), kemudian cuba semula jika perlu (maksimum 3 kali). */
  const q=sub(ME,w);clearTimeout(q._t);if(q.rconflict)return false;
  const t0=Date.now();let cuba=0;
  while((q.rdirty||q.rbusy)&&Date.now()-t0<120000){
    if(q.rconflict)return false;
    if(!q.rbusy){if(cuba>=3||q.offline)break;cuba++;await saveRefl(w);clearTimeout(q._t);continue;}
    await new Promise(r=>setTimeout(r,200));
  }
  if(!q.rdirty&&!q.rbusy)return true;
  if(!q.rErrMsg&&q.rbusy)q.rErrMsg='pelayan lambat menjawab';
  return false;
}

/* Pembantu Pengurusan Murid menghantar LAPORAN, bukan RPH: semua perkataan 'RPH' pada skrin mereka dipaparkan sebagai 'laporan' (nama fail tidak diubah). */
(function(){
  const ppm=()=>/pengurusan murid/i.test(typeof ME_JAWATAN==='string'?ME_JAWATAN:'');
  const tuk=t=>t.replace(/(^|[.!?]\s+|:\s+)RPH\b/g,'$1Laporan').replace(/\bRPH\b/g,'laporan');
  const ATTR=['aria-label','placeholder','title'];
  function proses(n){
    if(!ppm()||!n)return;
    if(n.nodeType===3){if(/\bRPH\b/.test(n.nodeValue)){const p=n.parentNode;if(p&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName))return;const v=n.nodeValue,k=tuk(v);n.nodeValue=/^\s*RPH\b/.test(v)&&!/^\s*RPH_/.test(v)?k.replace(/^(\s*)laporan/,'$1Laporan'):k;}return;}
    if(n.nodeType!==1||/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.nodeName))return;
    ATTR.forEach(a=>{const v=n.getAttribute&&n.getAttribute(a);if(v&&/\bRPH\b/.test(v))n.setAttribute(a,tuk(v));});
    for(let c=n.firstChild;c;c=c.nextSibling)proses(c);
  }
  let busy=false;
  const ob=new MutationObserver(ms=>{if(busy||!ppm())return;busy=true;try{ms.forEach(m=>{if(m.type==='characterData')proses(m.target);else m.addedNodes.forEach(proses);});}finally{busy=false;}});
  ob.observe(document.body,{childList:true,subtree:true,characterData:true});
  document.title=document.title;
})();
