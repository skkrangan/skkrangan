<style>
/* Layout: halaman penuh, tanpa bingkai. Header putih, hijau dan emas. Staf = a scroll of week panels; Pentadbir = review scroll + a teacher x week matrix. */
:root{
  /* Putih, hijau, emas. --navy = hijau jenama (nama pemboleh ubah dikekalkan), --blue = emas */
  --navy:#0F5C36; --blue:#B8862F; --gold-soft:#F7EEDB; --green-soft:#EAF3EC;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F8F5; --line:#DCE6DF; --line-strong:#B6C9BC;
  --fg:#14291D; --muted:#4F645A; --link:#0F5C36;
  --ok:#1D7A4B; --ok-bg:#E1F2E9;
  --sent:#1B63A8; --sent-bg:#E2EFFB;
  --fix:#9A5200; --fix-bg:#FCEBD4;
  --late:#B3261E; --late-bg:#FBE3E1;
  --idle:#56685E; --idle-bg:#EAF0EC;
  --head-bg:#FFFFFF; --head-fg:#0F5C36; --head-muted:#4F645A;
  --focus:#B8862F;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{margin:0;min-height:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:.86em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header: putih, tajuk hijau, garis emas */
.top{background:var(--head-bg);color:var(--head-fg);border-bottom:3px solid var(--blue);position:sticky;top:0;z-index:20}
.top-in{max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-family:var(--font-head);font-size:1.4rem;font-weight:700;letter-spacing:.01em;line-height:1.1;color:var(--navy)}
.brand span{font-family:var(--font-mono);font-size:.875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--head-muted)}
.bk{border:1px solid var(--line-strong);background:#fff;color:var(--navy);border-radius:99px;padding:6px 14px;font-weight:600;font-size:.875rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bk:hover{border-color:var(--navy);background:var(--green-soft)}
.top-l{display:flex;align-items:center;gap:14px;min-width:0;flex-wrap:wrap}
.top-l .lg2{margin-right:-4px}
.seg{display:flex;background:var(--green-soft);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:99px;font-weight:600;font-size:.875rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.tabs{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;background:transparent;color:var(--head-muted);padding:10px 14px;font-weight:600;font-size:.9rem;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap}
.tabs button:hover{color:var(--navy)}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--blue)}



.parts{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.file.part .ext{min-width:28px;text-align:center}
.pbtn{display:flex;gap:4px;flex-wrap:wrap}
.pbtn .btn[disabled]{opacity:.4;cursor:not-allowed}
.merge{display:flex;align-items:center;gap:12px;border:1px solid var(--ok);background:var(--ok-bg);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.merge.busy{border-color:var(--line-strong);background:var(--surface-2);color:var(--muted)}
.merge .nm{flex:1;min-width:0}.merge .nm b{display:block;overflow-wrap:anywhere}.merge .nm span{font-size:.875rem;color:var(--muted)}
.pdfv{width:100%;height:520px;border:1px solid var(--line);border-radius:8px;background:#fff}


/* viewer */
.vw{position:fixed;inset:0;z-index:50;background:rgba(6,14,40,.62);display:flex;align-items:stretch;justify-content:center;padding:0}
.vw-in{background:var(--surface);width:100%;max-width:1600px;display:flex;flex-direction:column;min-height:0}
@media(min-width:760px){.vw{padding:10px}.vw-in{border-radius:10px;overflow:hidden}}
.vw-h{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vw-h .t{flex:1;min-width:180px}.vw-h .t b{display:block;font-family:var(--font-head);font-size:1.05rem}.vw-h .t span{font-size:.875rem;color:var(--muted)}
.vw-b{flex:1;min-height:0;overflow:auto;background:var(--surface-2)}
.vw-b iframe{width:100%;height:100%;min-height:70vh;border:0;background:#fff;display:block}
.vw-f{border-top:1px solid var(--line);padding:8px 16px;font-size:.875rem;max-height:18vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.vw-f b{font-size:.875rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.vw-f p{margin:2px 0 0}
.vw-note{font-size:.875rem;color:var(--muted);padding:8px 16px;background:var(--idle-bg)}
.paper{background:#fff;color:#111;margin:16px auto;max-width:820px;padding:24px;box-shadow:0 1px 6px rgba(0,0,0,.18);font-size:.875rem}
.paper h3{margin:0 0 2px;font-family:var(--font-head);font-size:1.1rem;text-align:center}
.paper .sub{text-align:center;color:#444;margin-bottom:12px}
.paper table{width:100%;border-collapse:collapse;margin-top:8px}
.paper th,.paper td{border:1px solid #777;padding:6px 8px;text-align:left;vertical-align:top}
.paper th{background:#E8EBF2;width:1%;white-space:nowrap}
.paper .meta td{border:0;padding:2px 0}
.rk{display:flex;flex-direction:column;gap:10px}
.rk-i{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.rk-i .wk-n{align-self:start}
.rk-i p{margin:4px 0 0;font-size:.875rem;color:var(--muted)}
@media(max-width:560px){.rk-i{grid-template-columns:auto 1fr}.rk-i .btn{grid-column:1/-1}}


.hr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.acct{display:flex;align-items:center;gap:6px;font-size:.875rem;color:var(--muted)}
.acct>span{font-weight:600;color:var(--fg);margin-right:4px}
.acct button{border:1px solid var(--line-strong);background:#fff;color:var(--navy);border-radius:99px;padding:5px 12px;font-size:.875rem;font-weight:600;cursor:pointer}
.acct button:hover{background:var(--green-soft);border-color:var(--navy)}
.cutirow{background:var(--surface-2)}.cuti-in{display:flex;align-items:center;gap:12px;padding:12px 14px}
.hint.dl{margin:0 0 4px;color:var(--muted)}.hint.dl.late{color:var(--late);font-weight:600}
.hist{font-size:.875rem}.hist summary{cursor:pointer;font-weight:600;color:var(--muted)}.hist ol{margin:6px 0 0;padding-left:18px}.hist li{margin:2px 0}
.card input[type=text],.wrap input[type=search],.card select,.wrap select{border:1px solid var(--line-strong);background:var(--surface);border-radius:5px;padding:8px 10px;font:inherit;color:var(--fg)}
.jw-wrap{overflow-x:auto;border:1px solid var(--line-strong);border-radius:6px}
.jw-t{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed;font-size:.875rem}
.jw-t th,.jw-t td{border:1px solid var(--line);padding:0;text-align:center;vertical-align:middle}
.jw-t th{background:var(--green-soft);color:var(--navy);padding:6px 2px;font-weight:600;line-height:1.25}
.jw-t th small{display:block;font-weight:400;color:var(--muted);font-size:.875rem}
.jw-t th.hr{width:74px;text-align:left;padding-left:8px}
.jw-t td.rh,.jw-t th.rh{background:var(--surface-2);color:var(--muted);width:34px;font-size:.875rem}
.jw-t td.dy{background:var(--green-soft);color:var(--navy);font-weight:600;text-align:left;padding:0 8px}
.jw-t td button{display:block;width:100%;min-height:54px;border:0;background:transparent;font:inherit;cursor:pointer;padding:4px 3px;color:inherit}
.jw-t td button:hover{background:var(--gold-soft)}
.jw-t td button.e{color:#9AA5A0;font-size:1.1rem}
.jw-t td.ls{background:#E8F3EC}.jw-t td.ls button b{display:block;color:var(--navy)}.jw-t td.ls button span{display:block;color:var(--muted);font-size:.875rem}
.jw-t tbody td{height:54px}
.jw-t td.ls .ro{padding:8px 4px;text-align:center}.jw-t td.ls .ro b{display:block;color:var(--navy)}.jw-t td.ls .ro span{display:block;color:var(--muted);font-size:.875rem}
.jw-t td.ls.on,.jw-t td.on{outline:2px solid var(--navy);outline-offset:-2px}
.paper.docx{overflow:auto;padding:12px;background:#fff}.paper.docx .docx{margin:0 auto 12px!important;box-shadow:0 0 4px rgba(0,0,0,.2)}
.jw-ed{margin-top:12px;border:1px solid var(--navy);border-radius:6px;padding:12px;background:var(--surface)}
.jw-ed .f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.jw-ed label{display:flex;flex-direction:column;gap:3px;font-size:.875rem;color:var(--muted);font-weight:600}
.jw-ed input,.jw-ed select{font-weight:400;color:var(--fg)}
.jw-un{margin-top:12px}.jw-un li{display:flex;gap:8px;align-items:center;margin:4px 0}
.jw-col{display:flex;flex-direction:column;gap:6px}
.jw-col>b{color:var(--navy)}
.jw-r{display:flex;gap:6px}
.jw-r input{flex:1;min-width:0;box-sizing:border-box;border:1px solid var(--line-strong);border-radius:5px;padding:7px 9px;font:inherit}
.rl-lab{font-size:.9rem;color:var(--navy);padding-top:4px}
.warnbox{background:var(--gold-soft);border:1px solid #E6D3A6;border-radius:5px;padding:8px 10px}
.rl-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rl-row{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.rl-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--green-soft);color:var(--navy);font:600 .875rem var(--mono,monospace);display:flex;align-items:center;justify-content:center;margin-top:6px}
.rl-f{flex:1;display:flex;flex-direction:column;gap:6px}
.rl-f textarea{min-height:0;height:58px;resize:vertical}
.rl-att{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.875rem}
.rl-att label{display:flex;align-items:center;gap:6px}
.rl-att input{width:76px!important}
.rl-f input,.rl-f textarea{width:100%;box-sizing:border-box;border:1px solid var(--line-strong);border-radius:5px;padding:8px 10px;font:inherit;color:var(--fg);background:var(--surface)}
.card .miss-list li{display:flex;justify-content:space-between;align-items:center;gap:10px}
.exp select{border:1px solid var(--line-strong);background:var(--surface);border-radius:5px;padding:8px 10px}
/* ===== Bar sisi dan komponen Peringkat A–D ===== */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px;gap:18px;overflow:auto}
.side-brand{padding:0 8px;border-bottom:2px solid #E3B85A;padding-bottom:14px;display:flex;align-items:center;gap:10px}
.side-brand .lg{width:46px;height:46px;flex:none;border-radius:50%}.side-brand .sb-t{min-width:0}
.main.stale .wrap{pointer-events:none;opacity:.88}.stale-bar{background:var(--gold-soft);color:var(--navy);font-size:.875rem;padding:6px 14px;border-bottom:1px solid #E6D3A6}
.lg2{width:42px;height:42px;flex:none;border-radius:50%}.lg3{display:block;width:96px;height:96px;margin:0 auto 10px;border-radius:50%}
.side-brand b{font-family:var(--font-head);font-size:1.55rem;color:#fff;letter-spacing:.01em;line-height:1.1;display:block}
.side-brand b em{font-style:normal;color:#E3B85A}
.side-brand span{display:block;font:.875rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:#CFE3D6;margin-top:4px}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-h{font:600 .875rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:#E3B85A;padding:12px 12px 4px}
.side-nav button{background:transparent;border:0;color:#E8F2EB;text-align:left;padding:10px 12px;border-radius:6px;font-weight:600;font-size:.9rem;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;align-items:center;gap:8px}
.side-nav button:hover{background:rgba(255,255,255,.1)}
.side-nav button[aria-current="page"]{background:rgba(255,255,255,.16);border-left-color:#E3B85A;color:#fff}
.side-nav .badge{background:#E3B85A;color:#3a2a00;border-radius:99px;font-size:.875rem;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;font-size:.875rem;color:#CFE3D6;padding:0 8px;overflow-wrap:anywhere}
.main{min-width:0}
.pg{font-family:var(--font-head);font-size:1.2rem;margin:0;color:var(--navy)}
.tabs.inner{padding:0;border-bottom:1px solid var(--line);max-width:none;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:.875rem;color:var(--muted);font-weight:600}
.tile b{font-family:var(--font-head);font-size:2rem;line-height:1.1;color:var(--navy)}
.tile.ok{background:var(--ok-bg)}.tile.sent{background:var(--sent-bg)}.tile.sent b{color:var(--sent)}
.tile.fix{background:var(--fix-bg)}.tile.fix b{color:var(--fix)}
.tile.late{background:var(--late-bg)}.tile.late b{color:var(--late)}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem;vertical-align:top}
.tbl thead th{background:var(--surface-2);font-size:.875rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.tbl.prof th{width:200px;background:var(--surface-2);color:var(--muted);font-size:.875rem}
.mx-scroll .tbl{min-width:560px}
.cell.c-exc{background:var(--idle-bg);color:var(--idle);border:1px dashed var(--line-strong)}
button.cell{border:0;cursor:pointer;font:inherit;font-weight:700;padding:0}
button.cell:hover{outline:2px solid var(--blue)}
.charts{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:end}
.bars{display:flex;gap:14px;align-items:flex-end;height:180px;border-bottom:1px solid var(--line-strong);padding:0 8px;margin-bottom:28px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bcol i{display:block;width:100%;max-width:56px;border-radius:4px 4px 0 0;min-height:2px}
.bcol em{font-style:normal;font-weight:700;font-size:.9rem}
.bcol span{font-size:.875rem;color:var(--muted);text-align:center;position:absolute;transform:translateY(22px);white-space:nowrap}
.dwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.donut span{position:relative;z-index:1;font:700 1.2rem var(--font-head);color:var(--navy)}
@media(max-width:1000px){.shell{grid-template-columns:190px minmax(0,1fr)}.side-brand b{font-size:1.3rem}.side-nav button{padding:9px 10px;font-size:.875rem}.charts{grid-template-columns:1fr}.wrap{padding:16px 14px 48px}.top-in{padding:10px 14px}}
/* ===== Penambahbaikan antara muka: teks lebih besar, tindakan utama jelas, menu telefon boleh buka/tutup ===== */
body{font-size:17px;line-height:1.5}
.hero{background:linear-gradient(135deg,#0F5C3A,#17724A);color:#fff;border-radius:14px;padding:20px 22px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:5px solid #E3B85A}
.hero h3{margin:0 0 4px;font-size:1.45rem;color:#fff}.hero p{margin:2px 0;color:#E8F2EB;font-size:1rem}.hero .hs{display:inline-block;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 12px;font-weight:700;font-size:.9rem;margin-bottom:6px}
.hero .btn{background:#E3B85A;color:#2b2000;border-color:#E3B85A;font-size:1.05rem;padding:12px 22px;font-weight:700}.hero .btn:hover{background:#efc86f}
button.tile{text-align:left;cursor:pointer;font:inherit;width:100%}button.tile:hover{border-color:#17724A}button.tile[aria-pressed="true"]{outline:3px solid #E3B85A;border-color:#17724A}
.tile b{font-size:2.2rem}.tile span{font-size:.9rem}
.wk2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.wk2 select{font-size:1rem;padding:9px 10px;min-height:44px}.wk2 .btn{min-height:44px}
.rday{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:#fff}.rl-f{min-width:0;flex:1}.rl-f textarea,.rl-td select,.rl-td input{width:100%;box-sizing:border-box;max-width:100%}
.rl-td{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-weight:600}.rl-td select,.rl-td input{font:inherit;padding:10px;border:1px solid var(--line,#cfd8cf);border-radius:8px;background:#fff}
.rday>summary{cursor:pointer;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:flex-start;list-style:none;font-size:1.05rem}.rday>summary .pill{margin-left:auto}
.rday>summary::-webkit-details-marker{display:none}.rday>summary::before{content:'▸';margin-right:8px;color:#17724A}.rday[open]>summary::before{content:'▾'}
.rday .rl-row{padding:0 12px 10px}
.mnu{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:700;font-size:1rem;color:#0F5C3A;cursor:pointer;min-height:44px}
.scrim{display:none}
@media(max-width:760px){
  .shell{display:block}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(84vw,310px);z-index:60;transform:translateX(-104%);transition:transform .2s;height:100vh;padding:18px 12px;box-shadow:4px 0 18px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
  .mnu{display:inline-flex;align-items:center;gap:6px}
  .side-brand span,.side-foot,.side-h,.side-brand .sb-t{display:block}
  .side-nav button{font-size:1.02rem;padding:13px 12px;border-left:3px solid transparent;border-bottom:0;justify-content:space-between;text-align:left}
  .side-nav button[aria-current="page"]{border-left-color:#E3B85A;border-bottom:0}.side-nav .badge{display:inline-block}
  .hero{padding:16px}.hero .btn{width:100%}
}
@media print{.side,.top,.noprint,.actions .btn{display:none!important}.shell{display:block}.wrap{max-width:none;padding:0}.card{break-inside:avoid}}
@page{margin:18mm}
#printarea{display:none}
@media print{body.printing>*:not(#printarea){display:none!important}body.printing #printarea{display:block;color:#000;font:12pt/1.4 Georgia,'Times New Roman',serif}
#printarea h1{font-size:15pt;text-align:center;margin:0 0 2pt;letter-spacing:.5px}#printarea .ps{text-align:center;margin:0 0 12pt;font-size:10.5pt}
#printarea table{width:100%;border-collapse:collapse;margin:6pt 0 10pt}#printarea th,#printarea td{border:1px solid #000;padding:4pt 6pt;vertical-align:top;text-align:left;font-size:10.5pt}
#printarea .meta td{border:0;padding:1pt 6pt 1pt 0;font-size:11pt}#printarea .sg{display:flex;gap:30pt;margin-top:34pt}#printarea .sg div{flex:1;border-top:1px solid #000;padding-top:4pt;font-size:10.5pt}
#printarea tr{break-inside:avoid}}
@media print{.top,.actions,.chips,.toast,.exp,#viewer{display:none!important}body{background:#fff}.mx-scroll{overflow:visible}}

/* dashboard */
.dtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dtile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.dtile b{display:block;font-family:var(--font-head);font-size:1.7rem;line-height:1.1}
.dtile span{font-size:.875rem;color:var(--muted)}
.dtile.bad b{color:var(--late)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.gcard.bad{border-left:4px solid var(--late)}.gcard.me{border-color:var(--navy);background:var(--green-soft)}
.gc-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.gc-h .nm b{display:block;font-size:.95rem}.gc-h .nm span{font-size:.875rem;color:var(--muted)}
.gc-s{display:flex;flex-direction:column;gap:4px}.gc-s>span{font-size:.875rem;color:var(--muted);font-weight:600}
.gc-n{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.gc-n b{display:block;font-family:var(--font-head);font-size:1.15rem;line-height:1.1}.gc-n span{font-size:.875rem;color:var(--muted)}
.dlist{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.drow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) 200px;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow .nm b{display:block;font-weight:600}
.drow .nm span{font-size:.875rem;color:var(--muted)}
.dseg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.dseg i{display:block;height:10px;border-radius:2px;background:var(--idle-bg);border:1px solid var(--line)}
.dseg i.ok{background:var(--ok);border-color:var(--ok)}
.dseg i.sent{background:var(--sent);border-color:var(--sent)}
.dseg i.fix{background:var(--fix);border-color:var(--fix)}
.dseg i.late{background:var(--late);border-color:var(--late)}
.dseg i.cuti{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px);border-color:var(--line)}
.dseg i.fut{opacity:.45;background:transparent;border-style:dashed}
.dseg.thin{gap:1px}.dseg.thin i{height:8px;border-radius:1px}
.dseg.gc-r{gap:4px}.dseg.gc-r>div{text-align:center;min-width:0}.dseg.gc-r i{height:16px}.dseg.gc-r em{font-style:normal;font-size:.875rem;color:var(--muted)}
.dlab{display:flex;justify-content:space-between;font-size:.875rem;color:var(--muted);margin-top:3px}
.drow .nm .you{display:inline;font-size:.875rem;font-weight:600;background:var(--sent-bg);color:var(--sent);padding:1px 6px;border-radius:9px;margin-left:4px}
.dup{text-align:right}
.dup b{display:block;font-family:var(--font-head);font-size:1.05rem}
.dup span{font-size:.875rem;color:var(--muted)}
.dup.bad b{color:var(--late)}
.dleg{display:flex;flex-wrap:wrap;gap:12px;font-size:.875rem;color:var(--muted)}
.dleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media(max-width:620px){.drow{grid-template-columns:1fr 150px}.drow .dbar{grid-column:1/-1;order:3}}

/* page */
.wrap{max-width:1400px;margin:0 auto;padding:24px 24px 64px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--font-head);font-weight:700;font-size:1.3rem;margin:0;letter-spacing:.005em;color:var(--navy)}
.wrap>div>h2::after{content:"";display:block;width:44px;height:3px;background:var(--blue);margin-top:6px;border-radius:2px}
.lead{margin:0;color:var(--muted);font-size:.9rem;max-width:68ch}
.flow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.875rem;color:var(--muted);margin:0}
.flow i{font-style:normal;color:var(--line-strong)}
.flow b{color:var(--fg);font-weight:600}

.focus{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:6px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.focus .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.focus .t strong{font-family:var(--font-head);font-size:1.05rem}
.focus .t span{color:var(--muted);font-size:.88rem}
.tally{display:flex;flex-wrap:wrap;gap:6px}

/* buttons */
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);padding:9px 14px;border-radius:5px;font-weight:600;font-size:.88rem;cursor:pointer}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{border-color:var(--fix);color:var(--fix)}
.btn.sm{padding:6px 10px;font-size:.875rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.875rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.sent{background:var(--sent-bg);color:var(--sent)}
.pill.fix{background:var(--fix-bg);color:var(--fix)}
.pill.late{background:var(--late-bg);color:var(--late)}
.pill.idle{background:var(--idle-bg);color:var(--idle)}

/* week panels */
details.week{background:var(--surface);border:1px solid var(--line);border-radius:6px}
details.week>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px}
details.week>summary::-webkit-details-marker{display:none}
.wk-n{font-family:var(--font-mono);font-weight:500;font-size:.875rem;background:var(--navy);color:#fff;border-radius:4px;padding:4px 7px;min-width:36px;text-align:center}
.wk-meta{display:flex;flex-direction:column;min-width:0}
.wk-meta strong{font-family:var(--font-head);font-size:1rem;line-height:1.2}
.wk-meta .mono{color:var(--muted)}
.now{font-size:.875rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--link);border:1px solid var(--link);border-radius:3px;padding:1px 6px}
.sp{flex:1}
.sum-pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 3px 2px;flex:none;transition:transform .15s}
details[open]>summary .chev{transform:rotate(-135deg);margin-bottom:-3px}
.week-body{border-top:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:16px}
@media (max-width:560px){details.week>summary{flex-wrap:wrap}.sum-pills{justify-content:flex-start;width:100%;order:5}}

/* parts */
.lbl{font-size:.875rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:block}
.hint{text-transform:none;letter-spacing:0;font-weight:400}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px dashed var(--line-strong);border-radius:6px;padding:22px 14px;cursor:pointer;background:var(--surface-2);color:var(--muted);font-size:.9rem}
.drop strong{color:var(--fg);font-size:.95rem}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--blue);background:var(--sent-bg)}
.file{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface-2)}
.ext{font-family:var(--font-mono);font-size:.875rem;font-weight:500;background:var(--navy);color:#fff;border-radius:3px;padding:3px 6px}
.file .nm{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}
.file .nm b{font-family:var(--font-mono);font-weight:500;font-size:.875rem;overflow-wrap:anywhere}
.file .nm span{font-size:.875rem;color:var(--muted)}
.err{color:var(--late);font-size:.875rem;margin:6px 0 0}
textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line-strong);border-radius:5px;padding:10px 12px;background:var(--surface);line-height:1.5}
textarea:disabled{background:var(--surface-2);color:var(--muted)}
.save{font-size:.875rem;color:var(--muted);margin-top:4px;min-height:1.2em}
.note{border-radius:5px;padding:10px 12px;font-size:.9rem;border:1px solid transparent}
.note b{display:block;font-size:.875rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.note p{margin:0}
.note small{display:block;margin-top:4px;opacity:.85}
.note.fix{background:var(--fix-bg);color:var(--fix)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.info{background:var(--idle-bg);color:var(--idle)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.actions .aside{font-size:.875rem;color:var(--muted)}

/* admin review rows */
.rows{display:flex;flex-direction:column}
.rv{padding:16px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.rv:first-child{border-top:0;padding-top:0}
.rv-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.rv-h div{display:flex;flex-direction:column;min-width:0}
.rv-h strong{font-family:var(--font-head);font-size:1.02rem}
.rv-h span.s{color:var(--muted);font-size:.875rem}
.quote{margin:0;border-left:3px solid var(--line-strong);padding:2px 0 2px 12px;font-size:.92rem}
.quote em{color:var(--muted)}
.rv.miss{padding:10px 0}
.rv.miss .rv-h strong{font-weight:600}

/* report */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px}
/* Pemilih minggu: satu minggu dipaparkan pada satu masa, bukan senarai panjang */
.wnav{display:flex;flex-direction:column;gap:8px}
.wnav-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wnav-r .cur{flex:1;min-width:150px;font-weight:600;color:var(--navy)}
.wsqs{display:flex;flex-wrap:wrap;gap:4px}
.wsq{position:relative;min-width:34px;height:32px;border:1px solid var(--line-strong);border-radius:6px;background:var(--idle-bg);color:var(--idle);font:600 .875rem var(--font-mono);cursor:pointer;padding:0 4px}
.wsq.ok{background:var(--ok-bg);color:var(--ok);border-color:#9FD2B4}.wsq.sent{background:var(--sent-bg);color:var(--sent);border-color:#9CC4EA}
.wsq.fix{background:var(--fix-bg);color:var(--fix);border-color:#EDC48B}.wsq.late{background:var(--late-bg);color:var(--late);border-color:#EDA9A3}
.wsq.cu{opacity:.45}.wsq.fut{opacity:.55}
.wsq[aria-pressed="true"]{outline:2px solid var(--navy);outline-offset:1px}
.wsq .dot{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:99px;background:var(--sent);color:#fff;font:600 .875rem/16px var(--font-body);text-align:center;padding:0 3px}
.wleg{font-size:.875rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:5px 12px;font-family:var(--font-mono);font-size:.875rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.big{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.big b{font-family:var(--font-head);font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-size:.92rem}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--idle-bg)}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)}.bar .b-sent{background:var(--sent)}.bar .b-fix{background:var(--fix)}.bar .b-late{background:var(--late)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.875rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{font-style:normal;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.sq{width:10px;height:10px;border-radius:2px;display:inline-block}
.miss-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:.92rem}
.miss-list li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:5px 0}
.miss-list li span{color:var(--muted);font-size:.875rem}
.paste{width:100%;min-height:120px;font-family:var(--font-mono);font-size:.875rem}
.mx-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.mx{border-collapse:collapse;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
.mx th,.mx td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line);font-size:.875rem}
.mx thead th{font-family:var(--font-mono);font-weight:500;font-size:.875rem;color:var(--muted);background:var(--surface-2)}
.mx thead th button{border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;padding:2px 4px;border-radius:3px}
.mx thead th.sel{background:var(--sent-bg);color:var(--sent)}
.mx td.sel{background:color-mix(in srgb,var(--sent-bg) 55%,transparent)}
.mx .who{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding-left:12px;min-width:170px;border-right:1px solid var(--line)}
.mx thead .who{background:var(--surface-2)}
.mx .who b{display:block;font-weight:600;font-size:.88rem}
.mx .who span{color:var(--muted);font-size:.875rem}
.mx tfoot td{font-weight:600;background:var(--surface-2);border-bottom:0;font-size:.875rem}
.mx tfoot .who{background:var(--surface-2)}
.cell{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:5px;font-size:.875rem;font-weight:700}
.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-sent{background:var(--sent-bg);color:var(--sent)}
.c-fix{background:var(--fix-bg);color:var(--fix)}
.c-late{background:var(--late-bg);color:var(--late)}
.c-now{border:1.5px solid var(--line-strong);color:var(--muted)}
.c-up{color:var(--line-strong)}
.late-tag{color:var(--late);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:6px;font-size:.88rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
.netbar,#netbar{position:fixed;top:0;left:0;right:0;background:#8a1c1c;color:#fff;padding:8px 14px;font-size:.875rem;font-weight:600;z-index:20;display:none}#netbar.show{display:block}
.toast.err{background:#8a1c1c;pointer-events:auto;font-weight:600}.toast-x{margin-left:10px;border:1px solid #fff;background:transparent;color:#fff;border-radius:6px;padding:6px 12px;font:inherit;min-height:36px;cursor:pointer}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.cmp>div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.88rem;max-height:220px;overflow:auto}@media(max-width:600px){.cmp{grid-template-columns:1fr}}
.tg-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}.tg-row:first-of-type{border-top:0}
.note.warn{background:#fff7e0;border-left:4px solid #c8960a}.note.good{background:#e7f5ec;border-left:4px solid #1f7a45}
.foot{color:var(--muted);font-size:.875rem;text-align:center;margin:6px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

small{font-size:.875rem}
/* ===== Penyeragaman paparan (17 Okt): ruang, butang, lapisan ===== */
.card{padding:20px;gap:16px}
.wrap{gap:18px}
.week-body{padding:18px 20px}
.note{padding:12px 14px;font-size:.95rem}
.btn{min-height:40px;font-size:.95rem;padding:9px 16px}
.btn.sm{min-height:36px;font-size:.9rem;padding:7px 12px}
.btn.pri,.btn.ok{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover,.btn.ok:hover{background:#0b4a2b;border-color:#0b4a2b}
.btn:not(.pri):not(.ok):not(.warn){background:#fff;color:var(--navy);border-color:var(--line-strong)}
.btn.warn{background:#fff;border-color:var(--fix);color:var(--fix)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pill{padding:4px 12px}
.save{font-size:.9rem}
.toast{z-index:90}#netbar{z-index:95}
@media(max-width:760px){.btn,.btn.sm,button.tile,.tg-row .btn{min-height:44px}.mnu{min-height:44px;min-width:44px}input[type=text],input[type=number],select,textarea{min-height:44px;font-size:1rem}.wrap{padding-left:16px;padding-right:16px}.card{padding:16px}}
/* Penyemak: dokumen di kiri, refleksi/catatan/keputusan di kanan (komputer); menegak di telefon */
.vw-f{font-size:1rem}.vw-f b{font-size:.875rem}
@media(max-width:899px){.vw-f{max-height:48vh}}
@media(min-width:900px){
  .vw-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,38%);grid-template-rows:auto auto minmax(0,1fr)}
  .vw-h,.vw-note{grid-column:1/-1}
  .vw-b{grid-column:1;grid-row:3}
  .vw-f{grid-column:2;grid-row:3;max-height:none;border-top:0;border-left:1px solid var(--line);padding:18px 22px;gap:14px;overflow:auto}
}
.vw-dec{display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--line);padding-top:12px}
.vw-dec textarea{width:100%;box-sizing:border-box;min-height:84px;font:inherit;padding:10px;border:1px solid var(--line-strong);border-radius:8px}
/* Sejarah versi, arkib sesi */
.vw-ver{border-top:1px solid var(--line);padding-top:8px}.vw-ver summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.vver-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}.vver-l li{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.vver-l p{margin:4px 0}
.ars-f{align-items:flex-end;flex-wrap:wrap}.ars-f label{display:flex;flex-direction:column;gap:4px}.ars-f select,.ars-f input{min-height:44px;font:inherit}
.ars-r{margin:6px 0 0;padding-left:18px}.ars-r li{margin:3px 0}
</style>

/* ===== Pembaca jadual waktu aSc (PDF) — berjalan dalam pelayar, tanpa AI, tiada data keluar =====
   Membaca kedudukan teks sebenar dalam PDF (bukan meneka daripada gambar). */
function jwParseItems(items){
  const out={ok:false,slots:[],jumlah:0,jangka:null,amaran:[],sebab:''};
  const T=items.map(i=>({s:String(i.s).trim(),x:i.x,y:i.y,w:i.w})).filter(i=>i.s);
  /* 1. Baris pengepala: nombor 1..N menaik pada satu baris */
  const nums=T.filter(i=>/^\d{1,2}$/.test(i.s));let head=null;
  nums.forEach(a=>{const g=nums.filter(b=>Math.abs(b.y-a.y)<=3).sort((p,q)=>p.x-q.x);
    let ok=g.length>=4&&g.every((b,i)=>+b.s===i+1);if(ok&&(!head||g.length>head.length))head=g;});
  if(!head){out.sebab='Pengepala waktu (1,2,3…) tidak ditemui';return out;}
  const hy=head[0].y;
  const cols=head.map(b=>({n:+b.s,c:b.x+b.w/2}));
  const rh=T.find(i=>/^REHAT$/i.test(i.s)&&Math.abs(i.y-hy)<=12);
  if(rh)cols.push({n:null,c:rh.x+rh.w/2});
  cols.sort((a,b)=>a.c-b.c);
  const sp=(cols[cols.length-1].c-cols[0].c)/(cols.length-1);
  cols.forEach((c,i)=>{c.l=i?(cols[i-1].c+c.c)/2:c.c-sp/2;c.r=i<cols.length-1?(c.c+cols[i+1].c)/2:c.c+sp/2;});
  const L=cols[0].l,R=cols[cols.length-1].r;
  const colOf=x=>cols.find(c=>x>=c.l&&x<c.r)||(x<L?cols[0]:cols[cols.length-1]);
  /* 2. Label hari di sebelah kiri */
  const DM={mo:1,is:1,tu:2,se:2,we:3,ra:3,th:4,kh:4,fr:5,ju:5};
  const days=[];
  T.forEach(i=>{if(i.x+i.w<=L+4&&i.y>hy+15&&/^(mo|tu|we|th|fr|is|se|ra|kh|ju)[a-z]*$/i.test(i.s)&&i.s.length<=8){
    const h=DM[i.s.slice(0,2).toLowerCase()];if(h&&!days.some(d=>d.h===h))days.push({h,y:i.y});}});
  days.sort((a,b)=>a.y-b.y);
  if(days.length<2){out.sebab='Label hari tidak ditemui';return out;}
  const gaps=days.slice(1).map((d,i)=>d.y-days[i].y).sort((a,b)=>a-b);const rs=gaps[Math.floor(gaps.length/2)];
  /* 3. Kandungan sel */
  const body=T.filter(i=>{const cx=i.x+i.w/2;return cx>L&&cx<R&&i.y>hy+15&&!/^\d{1,2}:\d{2}$/.test(i.s);});
  const bad=[];
  days.forEach(d=>{
    const tk=body.filter(i=>i.y>=d.y-0.45*rs&&i.y<=d.y+0.42*rs);if(!tk.length)return;
    const ys=tk.map(i=>i.y),mn=Math.min(...ys),mx=Math.max(...ys),mid=(mn+mx)/2;
    const split=mx-mn>10;
    const sub=tk.filter(i=>!split||i.y<=mid).sort((a,b)=>a.x-b.x),cls=split?tk.filter(i=>i.y>mid).sort((a,b)=>a.x-b.x):[];
    if(cls.length&&cls.length!==sub.length){bad.push(['Isn','Sel','Rab','Kha','Jum'][d.h-1]);return;}
    sub.forEach((s,i)=>{const c=cls[i];
      const lo=Math.min(s.x,c?c.x:s.x),hi=Math.max(s.x+s.w,c?c.x+c.w:s.x+s.w);
      let a=colOf(lo+2),b=colOf(hi-2),ci=cols.indexOf(a),cj=cols.indexOf(b);
      while(ci<=cj&&cols[ci].n==null)ci++;while(cj>=ci&&cols[cj].n==null)cj--;
      if(ci>cj){bad.push('?');return;}
      const p1=cols[ci].n,p2=cols[cj].n,w=p1===p2?'W'+p1:'W'+p1+'–'+p2;
      out.jumlah+=p2-p1+1;
      out.slots.push({h:d.h,k:((c?c.s+' · ':'')+s.s+' · '+w).slice(0,60)});});
  });
  /* 4. Jumlah dijangka: "Lessons/week N" */
  const lw=T.find(i=>/^Lessons\/week$/i.test(i.s));
  if(lw){const v=T.filter(i=>/^\d+$/.test(i.s)&&i.x>lw.x&&Math.abs(i.y-lw.y)<=4).sort((a,b)=>a.x-b.x)[0];if(v)out.jangka=+v.s;}
  if(bad.length){out.sebab='Bilangan subjek/kelas tidak sepadan pada hari '+bad.join(', ');out.slots=[];out.jumlah=0;return out;}
  if(!out.slots.length){out.sebab='Tiada sel kelas ditemui';return out;}
  out.ok=true;
  if(out.jangka!=null&&out.jangka!==out.jumlah)out.amaran.push('Jumlah waktu bacaan ('+out.jumlah+') tidak sama dengan "Lessons/week" dalam fail ('+out.jangka+'). Semak dengan teliti.');
  return out;
}
let pdfJsP=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve();
  if(!pdfJsP)pdfJsP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res();};
    sc.onerror=()=>{pdfJsP=null;rej(new Error('Pustaka PDF tidak dapat dimuatkan.'));};document.head.appendChild(sc);});
  return pdfJsP;
}
async function jwParsePdf(buf){
  await loadPdfJs();

  const pg=await doc.getPage(1),vp=pg.getViewport({scale:1}),tc=await pg.getTextContent();

/* ===== Jadual waktu berbentuk grid: hari x waktu. Simpanan tetap {h,k}; k = "Kelas · Subjek · W2–3" ===== */
const PERIODS=[{n:1,m:'7:30',t:'8:00'},{n:2,m:'8:00',t:'8:30'},{n:3,m:'8:30',t:'9:00'},{n:4,m:'9:00',t:'9:30'},{n:5,m:'9:30',t:'10:00'},{n:null,m:'10:00',t:'10:30'},
  {n:6,m:'10:30',t:'11:00'},{n:7,m:'11:00',t:'11:30'},{n:8,m:'11:30',t:'12:00'},{n:9,m:'12:00',t:'12:30'},{n:10,m:'12:30',t:'13:00'}];
const PN=PERIODS.filter(x=>x.n);const pOf=n=>PERIODS.find(x=>x.n===n);
const jwWaktu=(a,b)=>'W'+a+(b>a?'–'+b:'');
const jwMasa=(a,b)=>pOf(a).m+'–'+pOf(b).t;
function jwK(l){return ((l.kelas?l.kelas+' · ':'')+l.subjek+' · '+jwWaktu(l.a,l.b)).slice(0,60);}
function jwFromK(h,k){
  let m=/^(.*?) · (.*?) · W(\d+)(?:–(\d+))?$/.exec(k),kelas,subjek,a,b;
  if(m){kelas=m[1];subjek=m[2];a=+m[3];b=m[4]?+m[4]:a;}
  else{m=/^(.*?) · W(\d+)(?:–(\d+))?$/.exec(k);if(!m)return null;kelas='';subjek=m[1];a=+m[2];b=m[3]?+m[3]:a;}

function jwLoad(sl){ /* sl=[{h,k}] -> ui.jwl (diletakkan) + ui.jwx (tiada waktu, perlu diletakkan) */
  ui.jwl=[];ui.jwx=[];ui.jwe=null;
  sl.forEach(x=>{if(!(x.h>=1&&x.h<=5))return;const l=jwFromK(x.h,x.k);if(l&&!jwBentur(l,-1))ui.jwl.push(l);else ui.jwx.push({h:x.h,k:x.k});});

function jwBentur(l,skip){return ui.jwl.findIndex((o,i)=>i!==skip&&o.h===l.h&&!(o.b<l.a||o.a>l.b))>=0;}
const jwKosong=()=>!(ui.jwl&&ui.jwl.length)&&!(ui.jwx&&ui.jwx.length);
const jwSlots=()=>ui.jwl.map(l=>({h:l.h,k:jwK(l)})).concat(ui.jwx);

let docxLibP=null;
function loadDocxLib(){

  if(!docxLibP)docxLibP=ld('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js').then(()=>ld('https://cdn.jsdelivr.net/npm/docx-preview@0.3.3/dist/docx-preview.min.js')).catch(e=>{docxLibP=null;throw e;});

/* Paparan fail Word: dirender dalam pelayar (tiada data keluar). Jika gagal dan dalam mod sebenar, minta PDF daripada pelayan. */
async function docxMount(t,w,f){
  const host=()=>document.getElementById('docx-host'),body=()=>document.getElementById('vbody');
  const showPdf=async()=>{const r=await api('getfilePdf',{t:t,w});const bin=atob(r.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    f.pdfUrl=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));const bb=body();if(bb)bb.innerHTML=viewBody(t,w,f);};
  /* Sistem sebenar: PDF daripada Google (paling setia pada susun atur Word). Demo / jika gagal: render dalam pelayar. */
  if(LIVE&&f.fileId){try{await showPdf();return;}catch(e){}}
  try{
    await loadDocxLib();const blob=await (await fetch(f.url)).blob();const h=host();if(!h)return;
    h.innerHTML='';await window.docx.renderAsync(blob,h,null,{inWrapper:false,breakPages:true,ignoreLastRenderedPageBreak:true});
    if(!h.querySelector('section,article,p,table'))throw new Error('kosong');
    const fit=()=>{const hh=host();if(!hh)return;let mx=0;hh.querySelectorAll('section.docx').forEach(s=>{mx=Math.max(mx,s.scrollWidth,s.offsetWidth);});
      const k=mx?Math.min(1,(hh.clientWidth-24)/mx):1;hh.style.zoom=k;};
    fit();
    const nt=document.createElement('p');nt.className='hint';nt.style.cssText='margin:8px 12px;text-align:center';nt.textContent='Paparan anggaran dalam pelayar. Jadual yang kompleks mungkin tidak tepat; gunakan Muat turun untuk salinan asal.';
    h.parentNode.insertBefore(nt,h);
  }catch(e){
    f.pdfErr=e&&e.message||'ralat';
    const bb=body();if(bb)bb.innerHTML=viewBody(t,w,f);
  }
}

/* --- Staf: dashboard --- */
function myStats(){let belum=0,hantar=0,disemak=0,fix=0,kec=0;
  weeks.forEach(wk=>{if(wk.cuti||wk.n>CURRENT)return;const k=stOf({id:ME},wk.n);
    if(k==='disemak')disemak++;else if(k==='dihantar')hantar++;else if(k==='pembetulan')fix++;else if(k==='dikecualikan')kec++;else belum++;});
  return{belum,hantar,disemak,fix,kec};}
function notifItem(n,lihat){
  const cls=n.readAt?'info':n.jenis==='pembetulan'?'fix':n.jenis==='disemak'?'ok':'info';
  return '<div class="note '+cls+'"><b>'+(NLBL[n.jenis]||'Notifikasi')+(n.w?' · Minggu '+n.w:'')+(n.readAt?'':' <span class="pill fix">Baharu</span>')+'</b><p>'+esc(n.mesej)+'</p><small>'+fmtFull(n.createdAt)+'</small>'+
   '<div class="actions">'+(lihat&&n.w&&sub(ME,n.w)?'<button class="btn sm" data-act="nlihat" data-w="'+n.w+'">Lihat</button>':'')+(n.readAt?'':'<button class="btn sm" data-act="nread" data-id="'+esc(n.id)+'">Tandakan dibaca</button>')+'</div></div>';}
const hfKat=(s,n)=>{const k=stOf({id:ME},n);return k==='dikecualikan'?'kec':k==='lewat'?'belum':k;};
function heroGuru(){
  const cur=sub(ME,CURRENT),wk=weeks[CURRENT-1],need=rNeed(ME,CURRENT),done=rDone(cur,ME,CURRENT);
  let st,btn='',info='';
  if(exc(ME,CURRENT)&&!submitted(cur)){st='Dikecualikan minggu ini';info='Anda dikecualikan daripada menghantar RPH minggu ini.';}
  else if(cur.status==='disemak'){st='Telah disemak';btn=['Lihat semakan','nlihat'];info='RPH anda telah disemak.';}
  else if(cur.status==='pembetulan'){st='Perlu pembetulan';btn=['Betulkan RPH','nlihat'];info='Pentadbir meminta pembetulan. Baca catatan dan hantar semula.';}
  else if(cur.status==='dihantar'){st='Menunggu semakan';info='RPH sudah dihantar.'+(done<need?' Refleksi: '+done+' / '+need+' kelas.':' Refleksi lengkap.');btn=done<need?['Lengkapkan Refleksi','nlihat']:['Buka RPH','nlihat'];}
  else if(!cur.file){st='Belum dihantar';btn=['Muat Naik RPH','nlihat'];info='Fail RPH belum dimuat naik.';}
  else{st='Fail sudah dimuat naik';btn=['Hantar RPH','nlihat'];info='Tekan Hantar untuk menghantar RPH kepada pentadbir.';}
  return '<div class="hero"><div><span class="hs">'+esc(st)+'</span><h3>RPH Minggu '+CURRENT+'</h3><p>'+esc(wk.label)+' '+wk.s.getFullYear()+' · Tarikh akhir hantar: <b>'+fmtDL(deadline(CURRENT))+'</b></p><p>'+esc(info)+'</p></div>'+
    (btn?'<button class="btn" data-act="'+btn[1]+'" data-w="'+CURRENT+'">'+btn[0]+'</button>':'')+'</div>';
}
/* Senarai tugasan yang masih tertunggak (selain minggu semasa yang sudah dipaparkan pada kad utama), paling lama dahulu. */
function tugasTertunggak(){const o=[];
  weeks.forEach(wk=>{if(wk.cuti||wk.n>CURRENT||wk.n===CURRENT)return;const s=sub(ME,wk.n);if(exc(ME,wk.n)&&!submitted(s))return;
    const d=rDone(s,ME,wk.n),n=rNeed(ME,wk.n);
    if(s.status==='pembetulan')o.push({w:wk.n,t:'Perlu pembetulan',c:'fix'});
    else if(s.status==='belum'||s.status==='draf')o.push({w:wk.n,t:s.file?'Fail sudah dimuat naik, belum dihantar':'RPH belum dimuat naik dan dihantar',c:'late'});
    else if(s.status==='dihantar'&&d<n)o.push({w:wk.n,t:'Refleksi belum lengkap ('+d+' / '+n+' kelas)',c:'idle'});});
  return o;}

}
function exUpdate(id,f){
  const a1=Math.min(+f.a,+f.b),b1=Math.max(+f.a,+f.b);
  if(!LIVE){const x=EXALL.find(y=>y.id===id);if(x){x.a=a1;x.b=b1;x.sebab=f.sebab.trim();x.oleh=MYNAME;}syncEx();ui.exForm=false;ui.exEdit=null;render();toast('Pengecualian dikemas kini.');return;}

function exRevoke(id){

  api('exemptionRevoke',{id}).then(r=>{setEx(r);render();toast('Pengecualian dibatalkan.');}).catch(handleErr);
}

/* --- Log audit (baca sahaja) --- */
function demoAudit(f){
  let rows=[];teachers.forEach(t=>weeks.forEach(w=>(sub(t.id,w.n).log||[]).forEach(l=>rows.push({masa:l.t,nama:l.who,emel:'',tindakan:l.act,minggu:w.n,sasaran:t.name,butiran:'',sebelum:'',selepas:''}))));
  EXALL.forEach(x=>{const t=tName(x.t);rows.push({masa:x.masa||new Date().toISOString(),nama:x.oleh,emel:'',tindakan:'Pengecualian diluluskan',minggu:x.a,sasaran:t?t.name:'',butiran:'M'+x.a+'-M'+x.b+': '+x.sebab,sebelum:'',selepas:''});});
  const jenis=[...new Set(rows.map(r=>r.tindakan))].sort();
  const d0=f.dari?new Date(f.dari+'T00:00:00+08:00').getTime():0,d1=f.hingga?new Date(f.hingga+'T23:59:59+08:00').getTime():Infinity,q=(f.cari||'').toLowerCase(),a=(f.tindakan||'').toLowerCase();
  rows=rows.filter(r=>{const t=new Date(r.masa).getTime();return t>=d0&&t<=d1&&(!a||r.tindakan.toLowerCase().includes(a))&&(!q||(r.nama+' '+r.sasaran+' '+r.butiran).toLowerCase().includes(q));}).sort((p,q2)=>new Date(q2.masa)-new Date(p.masa)).slice(0,200);
  return{log:rows,jenis};
}

function auditCsv(){
  const q=v=>{let t=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';};
  const rows=[['Masa','Pengguna','Emel','Tindakan','Minggu','Rekod berkaitan','Butiran','Sebelum','Selepas']].concat(AUDIT.map(l=>[fmtFull(l.masa),l.nama,l.emel,l.tindakan,l.minggu,l.sasaran,l.butiran,l.sebelum,l.selepas]));
  dlText('log-audit-erph.csv','﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'));
}
function dlText(name,text){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}

let DEMO_TK=null,DEMO_MULA=1,DEMO_SEM=[];
function urusApi(action,data){
  if(LIVE)return api(action,data);
  if(!DEMO_TK)DEMO_TK=weeks.map(w=>({mula:isoD(w.s),tamat:isoD(w.e),jenis:w.cuti?'cuti':'sekolah',nama:w.nama||''}));
  const rebuild=()=>buildWeeks(DEMO_TK.map((x,i)=>i+1<DEMO_MULA?Object.assign({},x,{jenis:'cuti',nama:'Sebelum sistem digunakan'}):x));
  if(action==='urusBaca')return Promise.resolve({urus:{takwim:DEMO_TK,mulaMinggu:DEMO_MULA,sementara:DEMO_SEM,staf:{sumber:'sandaran',masa:'',cmsBil:0,bil:teachers.length,terlepas:[]},hantaranBil:0,tahun:DEMO_TK.length?+DEMO_TK[0].mula.slice(0,4):2026}});
  if(action==='urusMula'){DEMO_MULA=data.mulaMinggu;rebuild();return Promise.resolve({mulaMinggu:DEMO_MULA});}
  if(action==='urusTakwim'){DEMO_TK=data.takwim;rebuild();return Promise.resolve({});}
  if(action==='urusSementara'){DEMO_SEM=data.senarai;return Promise.resolve({sementara:DEMO_SEM});}
  if(action==='urusSesi'){DEMO_TK=[];DEMO_MULA=1;subs={};buildWeeks([]);return Promise.resolve({ditutup:data.tahun,rekod:0});}
  return Promise.reject(new Error('Tindakan tidak diketahui.'));
}
function isoD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function urusMuat(segar){
  ui.urLoad=true;ui.urErr='';render();
  urusApi('urusBaca',segar?{segarStaf:1}:undefined).then(r=>{ui.ur=r.urus;ui.urLoad=false;ui.urF=ui.urF||{};
    ui.urF.tk=ui.ur.takwim.map(x=>[x.mula,x.tamat,x.jenis,x.nama].join(', ')).join('\n');ui.urF.mula=String(ui.ur.mulaMinggu);ui.urF.tahun='';render();if(segar)toast('Senarai staf disegarkan.');})
   .catch(e=>{ui.urLoad=false;ui.urErr=(e&&e.message)||'Gagal memuatkan.';handleErr(e);render();});
}
function urusParseTk(txt){
  const rows=[],err=[];
  String(txt||'').split(/\r?\n/).forEach((ln,i)=>{
    if(!ln.trim())return;
    const p=ln.split(/\t|,|;/).map(x=>x.trim());
    if(!/^\d{4}-\d{2}-\d{2}$/.test(p[0]||'')){if(rows.length===0&&!err.length)return;err.push('Baris '+(i+1)+': tarikh mula mesti yyyy-mm-dd.');return;}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(p[1]||'')){err.push('Baris '+(i+1)+': tarikh tamat mesti yyyy-mm-dd.');return;}
    const j=(p[2]||'sekolah').toLowerCase();
    if(j!=='sekolah'&&j!=='cuti'){err.push('Baris '+(i+1)+': jenis mesti sekolah atau cuti.');return;}
    rows.push({mula:p[0],tamat:p[1],jenis:j,nama:p.slice(3).join(', ')});
  });
  return {rows,err};
}
function urusDone(msg,reload){
  const f=()=>{ui.urSaving=false;toast(msg);urusMuat();};
  if(LIVE&&reload)loadInit(true).then(f).catch(handleErr);else f();
}
function urusTakwim(){
  const x=urusParseTk(ui.urF.tk);
  if(x.err.length){toast(x.err[0]);return;}
  if(!x.rows.length){toast('Tiada baris takwim.');return;}
  if(!confirm('Simpan takwim baharu ('+x.rows.length+' minggu, '+x.rows[0].mula+' hingga '+x.rows[x.rows.length-1].tamat+')? Nombor minggu akan mengikut susunan baris.'))return;
  urusApi('urusTakwim',{takwim:x.rows}).then(()=>urusDone('Takwim disimpan.',true)).catch(handleErr);
}
function urusMula(){
  const n=+ui.urF.mula;
  if(!(n>=1&&n<=weeks.length)){toast('Pilih minggu mula.');return;}
  urusApi('urusMula',{mulaMinggu:n}).then(()=>urusDone('Minggu mula guna ditetapkan: Minggu '+n+'.',true)).catch(handleErr);
}
function urusSemTambah(){
  const e=String(ui.urF.semE||'').trim().toLowerCase(),t=String(ui.urF.semT||'').trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast('Isi emel yang sah.');return;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(t)){toast('Pilih tarikh luput.');return;}
  const s=ui.ur.sementara.filter(x=>x.emel!==e).concat([{emel:e,tarikh:t}]);
  urusApi('urusSementara',{senarai:s}).then(()=>{ui.urF.semE='';ui.urF.semT='';urusDone('Akses sementara disimpan.');}).catch(handleErr);
}
function urusSemBuang(i){
  const s=ui.ur.sementara.filter((x,j)=>j!==i);
  urusApi('urusSementara',{senarai:s}).then(()=>urusDone('Akses sementara dibuang.')).catch(handleErr);
}
function urusSesi(){
  const th=String(ui.urF.tahun||'').trim();
  if(th!==String(ui.ur.tahun)){toast('Taip '+ui.ur.tahun+' untuk mengesahkan.');return;}

/* --- Laporan: carta, mengikut staf, senarai, statistik --- */
function donut(parts){const tot=parts.reduce((a,p)=>a+p[1],0)||1;let acc=0;const g=parts.map(p=>{const s=acc/tot*100;acc+=p[1];return p[2]+' '+s+'% '+(acc/tot*100)+'%';}).join(',');
  return '<div class="donut" role="img" aria-label="'+parts.map(p=>p[0]+' '+Math.round(p[1]/tot*100)+'%').join(', ')+'" style="background:conic-gradient('+g+')"><span>'+Math.round((parts[0][1]+(parts[1]?parts[1][1]:0))/tot*100)+'%</span></div>';}
function barChart(parts){const mx=Math.max(1,...parts.map(p=>p[1]));return '<div class="bars" role="img" aria-label="'+parts.map(p=>p[0]+' '+p[1]).join(', ')+'">'+parts.map(p=>'<div class="bcol"><em>'+p[1]+'</em><i style="height:'+Math.round(p[1]/mx*100)+'%;background:'+p[2]+'"></i><span>'+p[0]+'</span></div>').join('')+'</div>';}
function guruRows(){
  return teachers.map(t=>{let w=0,h=0,d=0,fx=0,lw=0,kc=0;active().forEach(x=>{const k=stOf(t,x.n);if(k==='dikecualikan'){kc++;return;}w++;if(k==='disemak'){h++;d++;}else if(k==='dihantar')h++;else if(k==='pembetulan'){fx++;h++;}else if(k==='lewat')lw++;});

const kind=n=>/\.pdf$/i.test(n)?'PDF':/\.jpe?g$/i.test(n)?'JPG':/\.png$/i.test(n)?'PNG':/\.docx$/i.test(n)?'DOCX':'';
function handleFiles(w,list){
  const s=sub(ME,w),files=Array.from(list||[]);
  if(!files.length)return;
  const bad=[],big=[],good=[];
  files.forEach(f=>{const k=kind(f.name);if(!k)bad.push(f.name);else if(f.size>10*1048576)big.push(f.name);else good.push({name:f.name,ext:k,size:f.size,blob:f});});
  const msg=[];
  if(bad.length)msg.push('Format tidak disokong: '+bad.join(', ')+'. Gunakan PDF, JPG, PNG atau DOCX.');
  if(big.length)msg.push('Melebihi 10 MB: '+big.join(', ')+'. Kecilkan saiz fail dan cuba lagi.');
  s.upErr=msg.join(' ');
  if(!good.length){render();return;}
  if(!s.parts)s.parts=[];
  if(s.file&&!s.parts.length&&!s.file.url)s.file=null; // fail contoh digantikan
  const DAYS=['isnin','selasa','rabu','khamis','jumaat'],dk=n=>{const i=DAYS.findIndex(d=>n.toLowerCase().includes(d));return i<0?9:i};
  good.sort((a,b)=>dk(a.name)-dk(b.name)||a.name.localeCompare(b.name,'ms',{numeric:true}));
  s.parts.push(...good);
  ui.open.add('g'+w);
  mergeParts(w);
}
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('Fail tidak dapat dibaca.'));r.readAsDataURL(b);});
async function finishFile(w,s,tok,blob,meta){

    s.upQ=job.catch(()=>{});

async function mergeParts(w){
  const s=sub(ME,w),parts=(s.parts||[]).slice(),tok=(s.mtok||0)+1;s.mtok=tok;
  const oldUrl=s.file&&s.file.url,dropOld=()=>{if(oldUrl&&(!s.file||s.file.url!==oldUrl))URL.revokeObjectURL(oldUrl);};
  if(!parts.length){
    if(LIVE&&s.file&&s.file.fileId){  // pelayan membuang kaitan fail dahulu; paparan hanya berubah selepas pengesahan
      s.merging=true;s.mstage='Membuang fail…';render();
      try{const r=await api('buangFail',{w,sv:s.semakVersi||0});applyRow(r.row);s.merging=false;s.mstage='';if(oldUrl)URL.revokeObjectURL(oldUrl);render();toast('Fail dibuang.');}
      catch(e){s.merging=false;s.mstage='';if(e&&(e.code==='AUTH'||e.code==='STALE')){handleErr(e);return;}toast('Fail belum berjaya dibuang. Sila cuba lagi.',true);render();}
      return;}
    if(oldUrl)URL.revokeObjectURL(oldUrl);s.file=null;s.merging=false;s.mstage='';if(s.status==='draf'&&!LIVE)s.status='belum';render();return;}
  const first=MYNAME.replace(/^Cg\.\s*/,'').split(' ')[0].toUpperCase();
  const stamp=()=>new Date().toISOString();
  s.merging=true;s.upFail=false;s.mstage='Menggabungkan fail…';
  try{
    if(LIVE&&parts.length>1&&parts.some(p=>p.ext==='DOCX')){
      s.mstage='Menukar fail Word kepada PDF…';render();
      for(const p of parts){
        if(p.ext!=='DOCX')continue;
        try{
          const r=await api('docxPdf',{b64:await blobToB64(p.blob)});
          if(s.mtok!==tok)return;
          const bin=atob(r.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
          p.blob=new Blob([u],{type:'application/pdf'});p.ext='PDF';p.size=p.blob.size;p.name=p.name.replace(/\.docx$/i,'.pdf');
        }catch(e){if(e&&e.code==='AUTH'){s.merging=false;s.mstage='';handleErr(e);return;}}
      }
      s.mstage='Menggabungkan fail…';
    }
    if(parts.length===1&&parts[0].ext==='DOCX'){
      const p=parts[0];render();
      if(await finishFile(w,s,tok,p.blob,{name:p.name,ext:'DOCX',size:p.size,date:fmtDT(new Date()),from:1})){dropOld();render();toast('Fail berjaya dimuat naik. Belum dihantar kepada pentadbir.');if(LIVE)api('docxCache',{w}).catch(()=>{});}
      return;
    }
    if(parts.some(p=>p.ext==='DOCX')){
      s.merging=false;s.upFail=true;s.upErr='Fail Word tidak dapat ditukar kepada PDF sekarang, jadi tidak boleh digabung dengan fail lain. Cuba lagi, atau simpan fail Word sebagai PDF dahulu.';
      render();return;
    }
    render();
    if(parts.length>20)throw Object.assign(new Error('Terlalu banyak fail (maksimum 20). Gabungkan sebahagian dahulu.'),{apiMsg:1});
    await loadPdfLib();
    const L=window.PDFLib,out=await L.PDFDocument.create(),A4=[595.28,841.89];
    for(const p of parts){
      const buf=await p.blob.arrayBuffer();
      if(p.ext==='PDF'){
        const d=await L.PDFDocument.load(buf);
        (await out.copyPages(d,d.getPageIndices())).forEach(pg=>out.addPage(pg));
      }else{
        const img=p.ext==='PNG'?await out.embedPng(buf):await out.embedJpg(buf);
        const land=img.width>img.height,pw=land?A4[1]:A4[0],ph=land?A4[0]:A4[1],m=24;
        const k=Math.min((pw-2*m)/img.width,(ph-2*m)/img.height),iw=img.width*k,ih=img.height*k;
        out.addPage([pw,ph]).drawImage(img,{x:(pw-iw)/2,y:(ph-ih)/2,width:iw,height:ih});
      }
    }
    if(out.getPageCount()>80)throw Object.assign(new Error('Terlalu banyak halaman (maksimum 80 halaman satu minggu).'),{apiMsg:1});
    const bytes=await out.save();
    if(s.mtok!==tok)return;
    const blob=new Blob([bytes],{type:'application/pdf'});
    if(blob.size>20*1048576){s.merging=false;s.upFail=true;s.upErr='Fail gabungan melebihi 20 MB. Kecilkan saiz gambar atau kurangkan bilangan fail.';render();return;}
    const ok=await finishFile(w,s,tok,blob,{name:'RPH_M'+w+'_'+first+'.pdf',ext:'PDF',size:blob.size,date:fmtDT(new Date()),pages:out.getPageCount(),from:parts.length});
    if(ok){dropOld();render();toast((parts.length>1?parts.length+' fail digabungkan menjadi satu. ':'')+'Fail berjaya dimuat naik. Belum dihantar kepada pentadbir.');}
  }catch(e){
    if(s.mtok!==tok)return;
    s.merging=false;s.mstage='';
    if(e&&e.code==='AUTH'){handleErr(e);return;}
    s.upFail=true;s.upErr=e&&e.apiMsg?e.message:(e&&e.message==='lib')?'Tidak dapat memuatkan pustaka penggabung. Semak sambungan internet dan cuba lagi.':'Satu fail tidak dapat dibaca atau dilindungi kata laluan. Buang fail itu dan cuba lagi.';
    render();
  }
}

let ID_TOKEN=null;
let tokWait=null;
function askParentToken(){
  return new Promise(res=>{tokWait=res;window.parent.postMessage({type:'erph-need-token'},CONFIG.PARENT_ORIGIN);setTimeout(()=>{if(tokWait===res){tokWait=null;res(false);}},8000);});

window.addEventListener('message',e=>{

  const d=e.data;if(!d||d.type!=='erph-token'||typeof d.token!=='string')return;
  ID_TOKEN=d.token;

  else if(ui.screen==='loading'||ui.screen==='login'||ui.stale){if(!ui.stale)ui.screen='loading';render();loadInit().catch(handleErr);}
});
async function api(action,data,_retry){
  const body=JSON.stringify(Object.assign({action,idToken:ID_TOKEN,reqId:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},data||{}));
  let r;
  const GET=()=>{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),45000);
    return fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:ac.signal}).finally(()=>clearTimeout(tm));};
  try{r=await GET();}
  catch(e){
    // Rangkaian terputus: cuba sekali lagi dengan reqId yang SAMA supaya pelayan tidak mengulang operasi yang mungkin sudah berjaya.
    await new Promise(res=>setTimeout(res,1500));
    try{r=await GET();}
    catch(e2){const x=new Error(e2&&e2.name==='AbortError'?'Pelayan tidak menjawab dalam 45 saat. Cuba lagi sebentar.':'Tiada sambungan internet atau pelayan tidak dapat dicapai.');x.apiMsg=true;x.code='NET';throw x;}
  }
  let j;try{j=await r.json()}catch(e){const x=new Error('Pelayan tidak memberi respons yang sah.');x.apiMsg=true;throw x;}
  if(!j.ok){if(j.code==='AUTH'&&EMBED&&!_retry){await askParentToken();return api(action,data,true);}
    const x=new Error(j.error||'Ralat pelayan.');x.code=j.code;x.versi=j.versi;x.teks=j.teks;x.apiMsg=true;throw x;}
  return j;
}
function applyRow(r){
  const k=key(r.t,r.w),q=subs[k]||(subs[k]=blankSub()),old=q.file;
  q.recordVersion=r.recordVersion||0;q.semakVersi=r.semakVersi||0;if(!q.rdirty&&!q.rbusy&&r.refleksiVersi!==undefined)q.refleksiVersi=r.refleksiVersi;q.status=r.status;if(!(q.rdirty&&r.t===ME&&r.status!=='disemak'))q.refleksi=r.refleksi||'';q.komen=r.komen||'';q.prevKomen=r.prevKomen||'';
  q.reviewed=r.reviewed?fmtDT(new Date(r.reviewed)):'';
  q.file=r.file?Object.assign({},r.file,{date:fmtDT(new Date(r.file.date||Date.now()))}):null;
  if(q.file&&old&&old.url&&old.fileId===q.file.fileId)q.file.url=old.url;
  if(r.log)q.log=r.log;
}
function setupLive(p){
  SETTINGS=Object.assign({hariSebelum:1,jam:17},p.tetapan||{});ui.setF=null;
  buildWeeks(p.takwim);teachers=p.guru;setEx(p);ME_EMEL=p.me.emel||'';ME_JAWATAN=p.me.jawatan||'';ME_PERANAN=p.me.peranan;ME_ADMIN=!!p.me.admin;ME_SEM=p.me.sementara||'';ME_MENGAJAR=!!p.me.mengajar;NOTIFS=p.notifikasi||[];JADUAL=p.jadual||{};SKIP=p.terlepas||[];ME=p.me.id;MYNAME=p.me.nama;
  const old=subs;subs={};
  const KEEP=['parts','merging','mstage','upErr','mtok','upQ','draft','err','rdirty','rbusy','rver','rrid','rridV','rconflict','srvVer','srvTeks','_t','refleksi','refleksiVersi','file','retryN','offline','sending','upFail'];
  teachers.forEach(t=>weeks.forEach(w=>{const k=key(t.id,w.n),b=blankSub(),o=old[k];
    if(o)KEEP.forEach(f=>{if(o[f]!==undefined&&(f!=='refleksi'&&f!=='refleksiVersi'||o.rdirty||o.rbusy))b[f]=o[f];});
    subs[k]=b;}));
  p.hantaran.forEach(applyRow);
  const m=[];if(p.me.peranan==='pentadbir')m.push('admin');if(p.me.mengajar)m.push('guru');
  m.push('dash');MENU=m;
  if(!MENU.includes(ui.role)||!ui.booted){ui.role=MENU[0];ui.tab=defTab(ui.role);}
  ui.booted=true;openDefaults();
}

/* Kedudukan guru dikekalkan semasa sesi tamat supaya selepas log masuk semula dia kembali ke minggu yang sedang diisi (draf refleksi sudah disimpan pada peranti). */
function posSimpan(){try{sessionStorage.setItem('inrph_pos',JSON.stringify({tab:ui.tab,role:ui.role,gw:ui.gw,aw:ui.aw}));}catch(_){}}
function posPulih(){try{const j=JSON.parse(sessionStorage.getItem('inrph_pos')||'null');sessionStorage.removeItem('inrph_pos');if(!j)return;if(j.role&&MENU.includes(j.role)){ui.role=j.role;if(j.tab)ui.tab=j.tab;}if(j.gw>=1&&j.gw<=weeks.length)ui.gw=j.gw;if(j.aw>=0&&j.aw<=weeks.length)ui.aw=j.aw;}catch(_){}}
function handleErr(e){
  if(e&&e.code==='AUTH')posSimpan();
  if(e&&(e.code==='AUTH'||e.code==='NOACCESS')){ui.stale=false;swrBuang();}
  if(EMBED&&e&&(e.code==='AUTH'||e.code==='NOACCESS')){ui.screen='login';ui.embedMsg=true;ui.loginErr=e.message||'Sesi tamat. Muat semula halaman portal.';render();return;}
  if(e&&(e.code==='AUTH'||e.code==='NOACCESS')){dropToken();ui.loginErr=e.message||'Sesi tamat. Sila log masuk semula.';showLogin();}
  else if(e&&e.code==='STALE'){toast(e.message,true);loadInit(ME_ADMIN).then(()=>render()).catch(()=>{});}
  else if(ui.stale){ui.staleErr=(e&&e.message)||'Tidak dapat memuatkan data terkini.';render();}
  else if(ui.screen==='loading'){ui.screen='error';ui.loadErr=(e&&e.message)||'Ralat tidak diketahui.';render();}
  else toast((e&&e.message)||'Ralat tidak diketahui.',true);
}
/* Satu tindakan yang sama (jenis + staf + minggu) tidak boleh berjalan dua kali serentak; klik berganda diabaikan. */
const SRV_BUSY=new Set();
async function srv(action,data,okMsg){
  const bk=action+'|'+((data&&data.t)||'')+'|'+((data&&data.w)||'');
  if(SRV_BUSY.has(bk))return null;
  SRV_BUSY.add(bk);
  try{const r=await api(action,data);if(r.row)applyRow(r.row);render();if(okMsg)toast(okMsg);return r;}
  catch(e){handleErr(e);render();return null;}
  finally{SRV_BUSY.delete(bk);}
}
let gisP=null;

  if(window.google&&google.accounts)return Promise.resolve();
  if(!gisP)gisP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=res;sc.onerror=()=>{gisP=null;rej(new Error('gis'))};document.head.appendChild(sc);});

async function onCred(r){
  ID_TOKEN=r.credential;try{sessionStorage.setItem('erph_tok',ID_TOKEN)}catch(e){}
  ui.screen='loading';ui.loginErr='';render();
  try{await loadInit();}catch(e){handleErr(e);}
}
const SWR_KEY='inrph_init';
async function loadInit(segar){
  const p=await api('init',segar?{segarStaf:1}:undefined);
  try{setupLive(p);}catch(e){const x=new Error('Gagal memproses data daripada pelayan: '+((e&&e.message)||e));x.apiMsg=true;throw x;}
  ui.stale=false;ui.staleErr='';ui.fresh=true;
  if(!weeks.length){
    if(ME_ADMIN){ui.role='admin';ui.tab='urus';ui.screen='app';render();urusMuat();toast('Takwim belum diisi. Masukkan takwim dalam Urus InRPH.');return;}
    const x=new Error('Takwim sesi belum diisi. Hubungi Penyelaras ICT.');x.apiMsg=true;throw x;
  }
  ui.screen='app';posPulih();render();
  try{sessionStorage.setItem(SWR_KEY,JSON.stringify({t:Date.now(),p}));}catch(e){}
}
function swrBuang(){try{sessionStorage.removeItem(SWR_KEY);}catch(e){}}
/* Paparkan data terakhir (tab ini sahaja) serta-merta sementara data terkini dimuatkan. Tindakan dikunci sehingga data terkini tiba. */
function swrCuba(){
  try{const j=JSON.parse(sessionStorage.getItem(SWR_KEY)||'null');if(!j||!j.p||Date.now()-j.t>12*3600*1000)return false;
    setupLive(j.p);ui.stale=true;ui.screen='app';render();return true;}catch(e){return false;}
}
function sambungSemula(){
  ui.staleErr='';render();
  const gagal=()=>{ui.stale=false;ui.staleErr='';ui.screen='login';ui.loginErr='Portal tidak memberi token log masuk. Muat semula halaman portal, atau log masuk di sini.';showLogin();};
  if(EMBED){window.parent.postMessage({type:'erph-ready'},CONFIG.PARENT_ORIGIN);askParentToken().then(ok=>{if(ok)loadInit().catch(handleErr);else gagal();});}
  else loadInit().catch(handleErr);
}
async function boot(){
  if(!LIVE){setupDemo();openDefaults();ui.screen='app';render();return;}
  ui.screen='loading';render();
  swrCuba();
  if(EMBED){
    window.parent.postMessage({type:'erph-ready'},CONFIG.PARENT_ORIGIN);
    setTimeout(()=>{if((ui.screen==='loading'||ui.stale)&&!ui.fresh){ui.stale=false;ui.screen='login';ui.loginErr='Portal tidak memberi token log masuk. Muat semula halaman portal, atau log masuk di sini.';showLogin();}},9000);
    return;
  }
  let tok=null;try{tok=sessionStorage.getItem('erph_tok')}catch(e){}
  if(tok){ID_TOKEN=tok;try{await loadInit();return;}catch(e){dropToken();ui.loginErr=(e.code==='AUTH')?'':(e.message||'');}}
  showLogin();
}

function csvText(){
  const m=ui.csvM||'semua';
  const ws=weeks.filter(w=>w.n<=CURRENT&&(m==='semua'||(w.s.getFullYear()+'-'+w.s.getMonth())===m));
  const q=v=>{let t=String(v);if(/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';};
  const KL={dikecualikan:'Dikecualikan',disemak:'Disemak',dihantar:'Dihantar',pembetulan:'Perlu pembetulan',lewat:'Lewat',belum:'Belum hantar'};
  const st=(x,w,tid)=>weeks[w-1].cuti?'Cuti':KL[stOf({id:tid},w)];
  const rows=[['Nama','Mata pelajaran / kelas'].concat(ws.map(w=>'M'+w.n+' ('+w.label+')'),['Dihantar','Lewat'])];
  teachers.forEach(t=>{let h=0,l=0;const c=ws.map(w=>{const x=sub(t.id,w.n);if(submitted(x)&&!w.cuti)h++;if(isLate(x,w.n,t.id))l++;return st(x,w.n,t.id);});rows.push([t.name,t.sub].concat(c,[h,l]));});
  return '﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
}
function downloadCsv(){
  const a=document.createElement('a'),u=URL.createObjectURL(new Blob([csvText()],{type:'text/csv;charset=utf-8'}));
  a.href=u;a.download='laporan-erph-'+(ui.csvM||'semua')+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function monthOpts(){
  const seen=[];active().forEach(w=>{const k=w.s.getFullYear()+'-'+w.s.getMonth();if(!seen.some(x=>x[0]===k))seen.push([k,MON[w.s.getMonth()]+' '+w.s.getFullYear()]);});
  return '<option value="semua"'+((ui.csvM||'semua')==='semua'?' selected':'')+'>Semua bulan</option>'+seen.map(x=>'<option value="'+x[0]+'"'+(ui.csvM===x[0]?' selected':'')+'>'+x[1]+'</option>').join('');
}

    s.komen=s.draft.trim();s.draft='';s.err=false;s.status='pembetulan';s.log.push({t:new Date().toISOString(),who:'Pentadbir',act:'Dikembalikan untuk pembetulan'});render();toast('Dikembalikan kepada staf untuk pembetulan.');}

  else if(a==='reload'){loadInit(ME_ADMIN).then(()=>toast('Data dikemas kini.')).catch(handleErr);}

/* Sela percubaan semula simpan refleksi: 5, 10, 20, 40 hingga maksimum 60 saat. Dihentikan semasa tiada sambungan dan disambung apabila sambungan pulih. */
const bkOff=n=>Math.min(60000,5000*Math.pow(2,Math.max(0,n-1)));
const OFFMSG='Tiada sambungan. Belum disimpan ke pelayan; draf disimpan pada peranti dan akan dicuba semula apabila sambungan pulih.';
async function saveRefl(w){
  const q=sub(ME,w);
  if(q.rbusy||q.rconflict)return;
  if(LIVE&&navigator.onLine===false){const sv0=document.getElementById('sv-'+w);if(sv0)sv0.textContent=OFFMSG;q.offline=true;return;}
  const ver=q.rver,txt=q.refleksi;q.rbusy=true;
  const set=m=>{const sv=document.getElementById('sv-'+w);if(sv)sv.textContent=m;};
  try{
    if(LIVE){if(!q.rrid||q.rridV!==ver){q.rrid='rf'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);q.rridV=ver;}
      const r=await api('refleksi',{w,text:txt,expectedVersion:q.refleksiVersi||0,reqId:q.rrid});q.refleksiVersi=r.row.refleksiVersi;}
    q.rbusy=false;q.retryN=0;q.offline=false;
    if(q.rver===ver){q.rdirty=false;drClear(w);set('Semua perubahan disimpan · '+fmtDT(new Date()));}
    else saveRefl(w);
  }catch(err){
    q.rbusy=false;
    if(err.code==='CONFLICT'&&err.teks===txt){q.refleksiVersi=err.versi;if(q.rver===ver){q.rdirty=false;drClear(w);set('Semua perubahan disimpan · '+fmtDT(new Date()));}else saveRefl(w);return;}
    if(err.code==='CONFLICT'){q.rconflict=true;q.srvVer=err.versi;q.srvTeks=err.teks||'';clearTimeout(q._t);
      const sv=document.getElementById('sv-'+w);
      if(sv)sv.innerHTML='Konflik: refleksi diubah dalam sesi lain. <button class="btn sm" data-act="rkeep" data-w="'+w+'">Kekalkan teks saya</button> <button class="btn sm" data-act="rsrv" data-w="'+w+'">Guna versi pelayan</button>';
      return;}
    if(err.code==='AUTH'){posSimpan();handleErr(err);return;}
    q.retryN=(q.retryN||0)+1;
    if(err.code==='NET'&&navigator.onLine===false){q.offline=true;const sv0=document.getElementById('sv-'+w);if(sv0)sv0.textContent=OFFMSG;return;}
    {const sv=document.getElementById('sv-'+w);if(sv){sv.textContent='Gagal disimpan: '+String(err.message||'cuba lagi').replace(/\.$/,'')+'. Teks anda masih ada di sini. Cuba semula automatik dalam '+Math.round(bkOff(q.retryN)/1000)+' saat. ';const bt=document.createElement('button');bt.className='btn sm';bt.dataset.act='rretry';bt.dataset.w=w;bt.textContent='Cuba lagi';sv.appendChild(bt);}}
    clearTimeout(q._t);q._t=setTimeout(()=>saveRefl(w),bkOff(q.retryN));
  }
}
async function flushRefl(w){
  const q=sub(ME,w);clearTimeout(q._t);if(q.rconflict)return false;
  for(let i=0;i<30&&(q.rdirty||q.rbusy);i++){if(!q.rbusy)await saveRefl(w);await new Promise(r=>setTimeout(r,150));}
  return !q.rdirty;
}
/* Status sambungan: bar kekal selagi tiada internet; apabila pulih, simpanan refleksi yang tertangguh dicuba semula serta-merta. */
function netBar(){let b=document.getElementById('netbar');if(!b){b=document.createElement('div');b.id='netbar';b.setAttribute('role','status');b.textContent='Tiada sambungan internet. Perubahan refleksi disimpan pada peranti dan akan dihantar apabila sambungan pulih.';document.body.appendChild(b);}return b;}
window.addEventListener('offline',()=>{if(!LIVE)return;netBar().classList.add('show');});
window.addEventListener('online',()=>{if(!LIVE)return;netBar().classList.remove('show');
  Object.keys(subs).forEach(k=>{const q=subs[k];if(q&&(q.rdirty||q.offline)&&!q.rbusy&&k.indexOf(ME+'-')===0){q.retryN=0;q.offline=false;const w=+k.slice(ME.length+1);saveRefl(w);}});
  if(ui.stale)loadInit().catch(handleErr);});

document.addEventListener('input',e=>{
  const r=e.target.closest('[data-rw]');
  if(r){const w=+r.dataset.rw,i=+r.dataset.ri,f=r.dataset.rf,q=sub(ME,w);
    const arr=parseR(q.refleksi);while(arr.length<=i)arr.push({k:'',t:'',h:'',j:'',x:'',n:''});
    let val=r.value;if(f==='h'||f==='j'){val=val.replace(/\D/g,'').slice(0,3);if(val!==r.value)r.value=val;}
    arr[i][f]=val;if((f==='t'||f==='h'||f==='x')&&!arr[i].k&&slotLabel(ME,i,w))arr[i].k=slotLabel(ME,i,w);
    if(f==='x'&&val)arr[i].n=arr[i].n||'';
    if(f==='h'&&val&&!arr[i].j.trim()){const lj=lastJ(arr[i].k||slotLabel(ME,i,w));if(lj){arr[i].j=lj;const ji=document.querySelector('[data-rw="'+w+'"][data-ri="'+i+'"][data-rf="j"]');if(ji)ji.value=lj;}}
    q.refleksi=serR(arr);drSave(w,q.refleksi,q.refleksiVersi);
    if(f==='h'||f==='j'){const bx=r.closest('.rl-att');if(bx){let er=bx.querySelector('.err');const bad=arr[i].h.trim()&&arr[i].j.trim()&&+arr[i].h>+arr[i].j;
      if(bad&&!er){er=document.createElement('span');er.className='err';er.textContent='Hadir melebihi jumlah murid.';bx.appendChild(er);}else if(!bad&&er)er.remove();}}
    q.rdirty=true;q.rver=(q.rver||0)+1;
    const sv=document.getElementById('sv-'+w);if(sv&&!q.rconflict)sv.textContent='Menyimpan…';
    const pl=document.getElementById('rp-'+w);if(pl){const d=rDone(q,ME,w),n=rNeed(ME,w);pl.textContent=d+' / '+n+' kelas';pl.className='pill '+(d>=n?'ok':'idle');}
    const dg=r.closest('details.rday');if(dg){const ar=parseR(q.refleksi),ids=[...new Set([...dg.querySelectorAll('[data-ri]')].map(x=>+x.dataset.ri))],ok=ids.filter(ix=>ar[ix]&&rFull(ar[ix])).length,sp=dg.querySelector('summary .pill');if(sp){sp.textContent=ok+'/'+ids.length+' sesi lengkap';sp.className='pill '+(ok>=ids.length?'ok':'idle');}}
    if(!q.rconflict){clearTimeout(q._t);q._t=setTimeout(()=>saveRefl(w),LIVE?900:450);}if(f==='x')render();else if(f==='n'){const bx=r.closest('.rl-f');if(bx){let er=bx.querySelector('.err');const bad=arr[i].x==='Lain-lain'&&!val.trim();if(bad&&!er){er=document.createElement('span');er.className='err';er.textContent='Nyatakan sebab.';bx.appendChild(er);}else if(!bad&&er)er.remove();}}return;}
  const je=e.target.closest('[data-jwe]');if(je&&ui.jwe){const k=je.dataset.jwe,E=ui.jwe;
    if(k==='a'||k==='b'){E[k]=+je.value;if(k==='a'&&E.b<E.a){E.b=E.a;const sb=document.querySelector('[data-jwe=b]');if(sb)sb.value=String(E.b);}}
    else E[k]=je.value;
    const m=document.getElementById('jw-masa');if(m)m.textContent='Masa: '+(E.b>=E.a?jwMasa(E.a,E.b):'—');return;}
  const ex=e.target.closest('[data-exf]');if(ex){ui.exF[ex.dataset.exf]=ex.value;return;}
  const dq=e.target.closest('[data-dq]');if(dq){ui.dq=dq.value;render();const el=document.querySelector('[data-dq]');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}return;}
  const k=e.target.closest('[data-kom]');
  if(k){const p=k.dataset.kom.split('-');const s=sub(p[0],+p[1]);s.draft=k.value;if(s.err&&k.value.trim()){s.err=false;const er=k.parentElement.querySelector('.err');if(er)er.remove();}}
});
